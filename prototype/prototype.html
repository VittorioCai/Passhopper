<title>Passhopper 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：手机为顶栏 + 内容 + 底部标签；≥1024px 为左侧导航 + 内容 + 右侧 AI 面板。
   视觉：欧洲站台信息屏（石板底 + 站牌黄）× 纸质通票（票根齿孔、My Trip 表格）。 */
:root {
  --bg: #F3F5F4; --surface: #FFFFFF; --surface-2: #E8ECEA; --line: #D2D9D6;
  --ink: #16202A; --ink-2: #4C5864;
  --board: #24303B; --board-ink: #F3F5F4; --board-ink-2: #B9C3CC;
  --signal: #F5B700; --signal-ink: #1A1400;
  --primary: #0B6E4F; --primary-ink: #FFFFFF;
  --ok: #1E7B45; --warn: #A35F00; --danger: #B3261E; --info: #1F5FA8;
  --ok-bg: #E4F2E9; --warn-bg: #FBF0DC; --danger-bg: #FBE9E7; --info-bg: #E6EEF8;
  --scrim: rgba(14, 20, 26, .45);
  --f-body: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "Barlow Condensed", "Arial Narrow", "Noto Sans SC", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 24px; --fs-num: 34px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1418; --surface: #171E24; --surface-2: #1F2830; --line: #2C3740;
    --ink: #E6EBEE; --ink-2: #9AA6B0;
    --board: #0A0F13; --board-ink: #E6EBEE; --board-ink-2: #8E9AA5;
    --signal: #FFC72C; --signal-ink: #1A1400;
    --primary: #3FBF8F; --primary-ink: #06241A;
    --ok: #5CCB8A; --warn: #F0A84A; --danger: #FF8A80; --info: #7FB2F0;
    --ok-bg: #12281C; --warn-bg: #30240E; --danger-bg: #391B19; --info-bg: #13223A;
    --scrim: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1418; --surface: #171E24; --surface-2: #1F2830; --line: #2C3740;
  --ink: #E6EBEE; --ink-2: #9AA6B0;
  --board: #0A0F13; --board-ink: #E6EBEE; --board-ink-2: #8E9AA5;
  --signal: #FFC72C; --signal-ink: #1A1400;
  --primary: #3FBF8F; --primary-ink: #06241A;
  --ok: #5CCB8A; --warn: #F0A84A; --danger: #FF8A80; --info: #7FB2F0;
  --ok-bg: #12281C; --warn-bg: #30240E; --danger-bg: #391B19; --info-bg: #13223A;
  --scrim: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--fs-md); line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--ink-2); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.ico { width: 20px; height: 20px; flex: none; }
.ico-sm { width: 16px; height: 16px; flex: none; vertical-align: -3px; }

/* ---------- 外框 ---------- */
.app { min-height: 100%; }
.sidenav { display: none; }
.main-col { min-width: 0; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 8px; min-height: 56px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar .title { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { font-family: var(--f-num); font-weight: 700; font-size: 24px; letter-spacing: .02em; }
.brand small { font-family: var(--f-body); font-weight: 500; font-size: 13px; color: var(--ink-2); margin-left: 6px; letter-spacing: 0; }
.proto-chip { font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 2px 6px; border: 1px dashed var(--ink-2); color: var(--ink-2); border-radius: 4px; white-space: nowrap; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 8px; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
.ai-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: var(--fs-sm); }
.ai-btn[aria-pressed="true"] { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }

.view {
  max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding-block: 16px 104px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 10px; font-size: 12px; color: var(--ink-2); text-decoration: none; position: relative; }
.tabbar a[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabbar a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; background: var(--signal); border-radius: 0 0 3px 3px; }

@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr) auto; }
  .sidenav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 20px 12px; border-right: 1px solid var(--line); background: var(--surface); }
  .sidenav .brand { padding: 0 8px 4px; }
  .sidenav .tripname { padding: 16px 8px 6px; font-size: var(--fs-xs); color: var(--ink-2); letter-spacing: .04em; }
  .sidenav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 15px; }
  .sidenav a:hover { background: var(--surface-2); }
  .sidenav a[aria-current="page"] { background: var(--surface-2); font-weight: 600; box-shadow: inset 3px 0 0 var(--signal); }
  .sidenav .spacer { flex: 1; }
  .tabbar { display: none; }
  .view { padding-block: 24px 48px; }
  .topbar .back { display: none; }
}

/* ---------- 通用组件 ---------- */
.board { background: var(--board); color: var(--board-ink); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.board::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--signal); }
.board .label { font-size: var(--fs-xs); letter-spacing: .08em; color: var(--board-ink-2); }
.board .big { font-family: var(--f-num); font-size: var(--fs-num); line-height: 1.05; font-weight: 700; color: var(--signal); font-variant-numeric: tabular-nums; }
.board .line { font-size: var(--fs-md); font-weight: 500; }
.board .sub { font-size: var(--fs-sm); color: var(--board-ink-2); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
.section-title { font-size: var(--fs-sm); font-weight: 600; color: var(--ink-2); letter-spacing: .04em; margin-top: 4px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 8px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn-primary:hover { background: var(--primary); filter: brightness(1.08); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--primary); }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: var(--fs-sm); }
.btn-block { width: 100%; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.badge { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 500; line-height: 1; padding: 4px 6px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; background: transparent; }
button.badge { cursor: pointer; }
.src-official { color: var(--ok); }
.src-live { color: var(--info); }
.src-user { color: var(--ink); }
.src-ai_estimate { color: var(--ink-2); border-style: dashed; }
.src-ai_search { color: var(--info); border-style: dashed; }
.src-stale { color: var(--warn); }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-xs); font-weight: 600; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.chip-must { background: var(--danger-bg); color: var(--danger); }
.chip-rec { background: var(--warn-bg); color: var(--warn); }
.chip-none { background: var(--surface-2); color: var(--ink-2); }
.chip-pass { background: var(--signal); color: var(--signal-ink); }
.chip-ticket { border: 1px solid var(--line); color: var(--ink); }
.chip-ok { background: var(--ok-bg); color: var(--ok); }

.issue { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; font-size: var(--fs-sm); }
.issue .ico { margin-top: 1px; }
.issue-warn { background: var(--warn-bg); color: var(--ink); }
.issue-warn .ico { color: var(--warn); }
.issue-danger { background: var(--danger-bg); color: var(--ink); }
.issue-danger .ico { color: var(--danger); }
.issue-info { background: var(--info-bg); color: var(--ink); }
.issue-info .ico { color: var(--info); }

.foot-note { font-size: var(--fs-xs); color: var(--ink-2); text-align: center; padding-top: 8px; }

/* ---------- 首页 ---------- */
.trip-card { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; cursor: pointer; }
.trip-card:hover { border-color: var(--ink-2); }
.trip-card h3 { font-size: var(--fs-lg); }
.trip-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--fs-sm); color: var(--ink-2); }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--ok); }

/* ---------- 路线 ---------- */
.summary-line { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--fs-sm); color: var(--ink-2); }
.summary-line b { color: var(--ink); font-family: var(--f-num); font-size: 18px; font-weight: 600; margin-right: 2px; }
.timeline { display: flex; flex-direction: column; }
.stop { display: grid; grid-template-columns: 24px minmax(0, 1fr); column-gap: 12px; }
.stop .rail { position: relative; }
.stop .rail::before { content: ""; position: absolute; left: 11px; top: 0; bottom: 0; width: 2px; background: repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 10px); }
.stop.first .rail::before { top: 14px; }
.stop.last .rail::before { bottom: calc(100% - 14px); }
.stop .dot { position: absolute; left: 4px; top: 7px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); }
.stop.home .dot { background: var(--signal); border-color: var(--board); }
.stop-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 4px 0; }
.stop-head .city { font-size: var(--fs-lg); font-weight: 700; }
.stop-head .local { font-size: var(--fs-sm); color: var(--ink-2); }
.stop-head .when { flex-basis: 100%; order: 3; font-size: var(--fs-sm); color: var(--ink-2); margin-top: -4px; }
.stop-head .stop-tools { margin-left: auto; }
.stop-tools { display: inline-flex; gap: 2px; }
.stop-tools button { width: 32px; height: 32px; border: 0; background: transparent; border-radius: 6px; color: var(--ink-2); display: inline-grid; place-items: center; }
.stop-tools button:hover { background: var(--surface-2); color: var(--ink); }
.stop-body { padding: 4px 0 16px; display: flex; flex-direction: column; gap: 8px; }
.stop-note { font-size: var(--fs-sm); color: var(--ink-2); }

.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; text-align: left; width: 100%; padding: 0; cursor: pointer; display: block; }
.ticket:hover { border-color: var(--ink-2); }
.ticket.problem { border-color: var(--warn); }
.ticket-main { padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 4px; }
.ticket-top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.train { font-family: var(--f-num); font-weight: 700; font-size: 18px; letter-spacing: .03em; display: inline-flex; align-items: center; gap: 4px; }
.times { font-family: var(--f-num); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }
.times sup { font-size: 12px; color: var(--ink-2); margin-left: 1px; }
.stations { font-size: var(--fs-sm); color: var(--ink-2); }
.perf { position: relative; border-top: 1.5px dashed var(--line); margin: 0; }
.perf::before, .perf::after { content: ""; position: absolute; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.perf::before { left: -9px; clip-path: inset(0 0 0 50%); }
.perf::after { right: -9px; clip-path: inset(0 50% 0 0); }
.ticket-foot { padding: 10px 14px 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: var(--fs-sm); }
.ticket-foot .price { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
.ticket-foot .price .num { font-size: 17px; font-weight: 600; }

/* ---------- 旅行日 ---------- */
.mytrip { border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--surface); }
.mytrip-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--ink); color: var(--bg); }
.mytrip-head .t { font-family: var(--f-num); font-weight: 700; letter-spacing: .14em; font-size: 18px; }
.mytrip-head .s { font-size: var(--fs-xs); opacity: .8; }
.mt-cols, .mt-row { display: grid; grid-template-columns: 60px minmax(0, 1fr) 80px; }
.mt-cols { font-size: 11px; letter-spacing: .08em; color: var(--ink-2); border-bottom: 1.5px solid var(--ink); }
.mt-cols > div { padding: 6px 10px; }
.mt-cols > div + div, .mt-row > div + div { border-left: 1px solid var(--line); }
.mt-row { border-bottom: 1px solid var(--line); }
.mt-row:last-child { border-bottom: 0; }
.mt-row > div { padding: 10px; min-width: 0; }
.mt-date { font-family: var(--f-num); font-variant-numeric: tabular-nums; line-height: 1.15; }
.mt-date b { font-size: 20px; font-weight: 700; display: block; }
.mt-date span { font-size: 13px; color: var(--ink-2); }
.mt-route { font-size: 15px; font-weight: 500; }
.mt-why { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.mt-row.err { background: var(--danger-bg); }
.mt-row.err .mt-why { color: var(--danger); }
.day-toggle { width: 100%; min-height: 40px; padding: 0 4px; border-radius: 6px; font-weight: 700; font-size: 15px; border: 1.5px solid var(--line); background: var(--surface); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 3px; }
.day-toggle.is-pass { background: var(--signal); color: var(--signal-ink); border-color: var(--signal); }
.day-toggle.is-ticket { border-color: var(--ink-2); }
.day-toggle.is-locked { border-style: dashed; color: var(--ink-2); cursor: help; font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: var(--fs-xs); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

/* ---------- 订座 ---------- */
.res-item { display: flex; flex-direction: column; gap: 8px; }
.res-item .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.res-item .top .num { font-weight: 700; font-size: 18px; }
.res-item.urgent { border-color: var(--warn); }
.res-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; padding-top: 4px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-sm); color: var(--ink-2); }
.field input, .field select, .field textarea { min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); width: 100%; }
.field textarea { min-height: 88px; resize: vertical; }
.mono { font-family: var(--f-mono); }
.done-line { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: var(--fs-sm); flex-wrap: wrap; }
.done-line:last-child { border-bottom: 0; }

/* ---------- 回本 ---------- */
.table-wrap { overflow-x: auto; }
table.plans { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.plans th { white-space: nowrap; text-align: left; font-weight: 600; color: var(--ink-2); font-size: var(--fs-xs); letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.plans td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.plans tr:last-child td { border-bottom: 0; }
table.plans td.r, table.plans th.r { text-align: right; }
table.plans td .num { font-size: 18px; font-weight: 600; }
table.plans td.range { white-space: nowrap; font-family: var(--f-num); font-size: 15px; }
table.plans .btn { white-space: nowrap; }
table.plans td { white-space: nowrap; }
table.plans td:first-child { white-space: normal; min-width: 92px; }
table.plans tr.rec td:first-child { box-shadow: inset 4px 0 0 var(--signal); font-weight: 600; }
table.plans tr.sel { background: var(--surface-2); }
.breakdown { display: flex; flex-direction: column; }
.bd-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.bd-row:last-child { border-bottom: 0; font-weight: 700; }
.bd-row .num { font-size: 18px; }
details.bd summary { cursor: pointer; font-size: var(--fs-sm); color: var(--primary); padding: 6px 0; }
.bd-sub { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink-2); padding: 3px 0 3px 12px; }

/* ---------- 向导、设置 ---------- */
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.steps i.on { background: var(--ink); }
.seg-ctl { display: flex; flex-wrap: wrap; gap: 8px; }
.seg-ctl button { min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; }
.seg-ctl button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); font-weight: 600; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { width: 44px; height: 44px; border: 0; background: var(--surface-2); font-size: 20px; }
.stepper span { width: 48px; text-align: center; font-family: var(--f-num); font-size: 20px; font-weight: 600; }
.or { display: flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: var(--fs-sm); }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pill-list { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: var(--fs-sm); }
.radio-row { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; }
.radio-row:has(input:checked) { border-color: var(--ink); }
.radio-row input { width: 18px; height: 18px; accent-color: var(--primary); }
.check-row { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; }

  const pass = passById(trip.passId);
  const days = dayChoices(trip);
  let fees = 0, tix = 0, feeSegs = [], tixSegs = [];
  for (const d of days) for (const s of d.segs) {
    if (d.choice === 'pass' && !s.home) { fees += s.fee; if (s.fee) feeSegs.push(s); }
    else { tix += s.p.mid; tixSegs.push(s); }
  }
  const passDays = days.filter(d => d.choice === 'pass');
  const errors = [];
  if (pass.kind === 'flexi' && passDays.length > pass.days) errors.push(`选了 ${passDays.length} 个旅行日，${pass.name} 只有 ${pass.days} 天。`);
  if (passDays.length > 1) {
    const sp = span(passDays[0].date, passDays[passDays.length - 1].date) + 1;
    if (sp > pass.validity) errors.push(`第一个和最后一个旅行日跨了 ${sp} 天，超过了通票 ${pass.validity} 天的有效期。`);
  }
  return { pass, days, passDays, fees, tix, feeSegs, tixSegs, total: pass.price + fees + tix, errors };
}
function segChoice(trip, s) {
  const d = dayChoices(trip).find(x => x.date === s.date);
  return s.home ? 'home' : d.choice;
}

function viewRoute() {
  const t = state.trip;
  const cc = currentCost(t);
  const resTodo = t.segs.filter(s => (s.res === 'mandatory' || s.res === 'recommended') && segChoice(t, s) === 'pass' && s.resStatus !== 'booked');
  const days = span(t.stops[0].date, t.stops[t.stops.length - 1].date) + 1;
  const homeSegs = t.segs.filter(s => s.home);
  const issues = [];
  homeSegs.forEach(s => issues.push(['info', `${stopName(t, s.after)} → ${nextStop(t, s.after).zh}：在居住国${t.traveller.country}境内，当天没有出境，不能用通票，需要单独买票。`]));
  if (resTodo.length) issues.push(['warn', `${resTodo.length} 段火车还没订座，其中夜车卧铺名额紧张。<a href="#reservations">去处理</a>`]);

const nextStop = (t, id) => t.stops[t.stops.findIndex(s => s.id === id) + 1];
function ticketHtml(t, s) {

/* ---------- 旅行日 ---------- */
function viewDays() {
  const t = state.trip;
  const cc = currentCost(t);
  const a = analyze(t);
  const pass = cc.pass;
  const pd = cc.passDays;
  const winStart = pd.length ? pd[0].date : t.segs[0].date;
  const winEnd = addDays(winStart, pass.validity - 1);
  const over = pass.kind === 'flexi' && pd.length > pass.days;
  const rows = cc.days.map(d => {
    const segs = d.segs;
    const routeTxt = segs.map(s => `${s.night ? ic('moon', 'ico-sm') + ' ' : ''}${stopName(t, s.after)} → ${nextStop(t, s.after).zh}`).join('<br>');
    const val = d.value;
    let why = '', err = false;
    if (d.choice === 'home') why = `在居住国${t.traveller.country}境内且当天不出境，只能买票 · 约 ${eur(segs[0].p.mid)}`;
    else if (d.choice === 'pass') {
      const fee = segs.reduce((x, s) => x + s.fee, 0);
      why = `单独买票约 ${eur(segs.reduce((x, s) => x + s.p.mid, 0))}${fee ? `，订座 ${eur(fee)}` : ''}，用通票省 ${eur(val)}`;
      if (segs.some(s => s.journey === 'out')) why += ' · 出境行程';
      if (segs.some(s => s.journey === 'in')) why += ' · 入境行程';
      if (d.date > winEnd || d.date < winStart) { err = true; why = '不在通票有效期内'; }
      if (d.night && d.date === winEnd) { err = true; why = '有效期最后一天不能坐夜车'; }
    } else {
      why = `买票约 ${eur(segs.reduce((x, s) => x + s.p.mid, 0))}，用通票只省 ${eur(val)}，旅行日留给更值的日子`;
    }
    if (over && d.choice === 'pass') err = true;
    const lbl = d.choice === 'pass' ? '通票' : '买票';
    const btn = d.choice === 'home'
      ? `<button class="day-toggle is-locked" data-act="toast" data-msg="居住国内且当天不出境的行程不能用通票" aria-label="${fmtMD(d.date)} 只能买票">${ic('lock', 'ico-sm')} 买票</button>`
      : `<button class="day-toggle is-${d.choice}" data-act="day" data-date="${d.date}" aria-label="${fmtMD(d.date)} 当前：${lbl}，点击切换">${lbl}</button>`;
    return `<div class="mt-row ${err ? 'err' : ''}" id="day-${d.date}">
      <div class="mt-date"><b>${fmtMD(d.date)}</b><span>${fmtWD(d.date)}</span></div>
      <div><div class="mt-route">${routeTxt}</div><div class="mt-why">${why}</div></div>
      <div>${btn}</div></div>`;
  }).join('');
  const changed = Object.keys(t.overrides).length > 0;
  const recCost = bestFor(pass, t, 'mid').cost;
  return `
  <div class="card stack">
    <div class="spread"><div><div style="font-weight:700;font-size:var(--fs-lg)">${pass.name}</div><div class="small muted">${pass.sub} · 有效期 ${fmtMD(winStart)}–${fmtMD(winEnd)}</div></div>
      <div style="text-align:right"><div class="num" style="font-size:30px;font-weight:700">${pd.length}<span class="muted" style="font-size:20px"> / ${pass.kind === 'flexi' ? pass.days : '—'}</span></div><div class="xs muted">已用旅行日</div></div></div>
  </div>
  ${cc.errors.map(e => `<div class="issue issue-danger">${ic('alert')}<span>${e}</span></div>`).join('')}
  <div class="legend"><span><i style="background:var(--signal)"></i>用旅行日</span><span><i style="border:1.5px solid var(--ink-2)"></i>单独买票</span><span><i style="border:1.5px dashed var(--ink-2)"></i>只能买票</span><span>点击右侧按钮可以切换</span></div>
  <div class="mytrip">
    <div class="mytrip-head"><span class="t">MY TRIP</span><span class="s">${t.traveller.country}居民 · ${t.traveller.age} · ${t.traveller.cls}</span></div>
    <div class="mt-cols"><div>日期</div><div>路线</div><div>使用</div></div>
    ${rows}
  </div>
  <div class="card spread" aria-live="polite">
    <div><div class="small muted">当前安排总花费</div><div class="num" style="font-size:28px;font-weight:700">${eur(cc.total)}</div></div>
    <div style="text-align:right">${changed ? `<div class="small ${cc.total > recCost ? 'status-err' : 'muted'}">推荐安排 ${eur(recCost)}</div><button class="btn btn-sm btn-ghost" data-act="days-reset">${ic('undo', 'ico-sm')}恢复推荐</button>` : `<span class="chip chip-ok">${ic('check', 'ico-sm')}这是最省的安排</span>`}</div>
  </div>
  <div class="small muted">推荐的通票是 ${a.rec.pass.name}。想换别的通票，去<a href="#value">回本</a>页面比较。</div>`;
}

/* ---------- 订座 ---------- */
function viewRes() {
  const t = state.trip;
  const items = t.segs.map(s => ({ s, c: segChoice(t, s) }));
  const need = items.filter(x => (x.s.res === 'mandatory' || x.s.res === 'recommended') && x.c === 'pass');
  const todo = need.filter(x => x.s.resStatus !== 'booked').sort((a, b) => (b.s.quota ? 1 : 0) - (a.s.quota ? 1 : 0));
  const booked = need.filter(x => x.s.resStatus === 'booked');
  const ticket = items.filter(x => x.s.res !== 'none' && x.c !== 'pass');
  const none = items.filter(x => x.c === 'pass' && (x.s.res === 'none' || x.s.res === 'optional'));
  const total = need.reduce((a, x) => a + x.s.fee, 0);
  const route = s => `${stopName(t, s.after)} → ${nextStop(t, s.after).zh}`;
  const link = s => LINKS[s.cc];
  const todoHtml = todo.map(({ s }) => {
    const open = state.openRes === s.id;

/* ---------- AI 助手 ---------- */
const QUICK = [['crowded', '第二周太赶了，少去一个城市'], ['strike', '7月底意大利有铁路罢工吗？'], ['why', '为什么有一天建议单独买票？']];
function renderAI() {
  const el = $('aiPanel');
  const inTrip = ['route', 'days', 'reservations', 'value'].includes(current());
  el.hidden = !(state.aiOpen && inTrip);
  if (el.hidden) return;
  const p = state.prefs;
  const provName = { deepseek: 'DeepSeek', claude: 'Claude', custom: '自定义' }[p.provider];
  const msgs = state.ai.msgs.map(m => m.role === 'me'
    ? `<div class="msg me">${esc(m.text)}</div>`
    : `<div class="msg ai"><span class="who">AI · ${provName}</span>${m.html}</div>`).join('');
  el.innerHTML = `
    <div class="ai-head">${ic('spark')}<span class="t">AI 助手 · ${provName}</span><span class="proto-chip">预设回复</span><button class="icon-btn" data-act="ai-toggle" aria-label="关闭 AI 助手">${ic('x')}</button></div>
    <div class="ai-msgs" id="aiMsgs" aria-live="polite">
      ${!state.ai.msgs.length ? `<div class="ai-empty"><b style="color:var(--ink)">可以让我做这些</b><span>· 用一句话改行程，我会先给你看改动，你确认后才生效</span><span>· 联网查罢工、停运、订座规则变化，并附上来源</span><span>· 解释旅行日和费用是怎么算的</span><span class="xs">原型说明：这里的回复是预设的，但改动预览里的费用由规则引擎实时计算。</span></div>` : msgs}
      ${state.ai.busy ? `<div class="thinking">思考中…<button class="btn btn-sm" data-act="ai-stop">${ic('stop', 'ico-sm')}停止</button></div>` : ''}
    </div>
    <div class="ai-quick">${QUICK.map(([k, q]) => `<button data-act="ai-q" data-k="${k}">${q}</button>`).join('')}</div>
    <form class="ai-input" data-act="ai-form"><input id="aiInput" placeholder="输入问题或要求…" aria-label="输入问题或要求" autocomplete="off"><button type="submit" aria-label="发送">${ic('send', 'ico-sm')}</button></form>`;
  const box = $('aiMsgs'); box.scrollTop = box.scrollHeight;
}
function aiAsk(key, text) {
  if (state.ai.busy) return;
  state.ai.msgs.push({ role: 'me', text });
  state.ai.busy = true;
  render();
  state.ai.timer = setTimeout(() => {
    state.ai.busy = false;
    state.ai.msgs.push({ role: 'ai', html: aiAnswer(key) });
    render();
  }, 1100);
}
function aiAnswer(key) {
  const t = state.trip;
  if (key === 'crowded') {
    if (!t.stops.find(s => s.id === 's5')) return `<span>已经去掉佛罗伦萨了。还想再调整的话，可以告诉我具体想多待哪里。</span>`;
    const before = analyze(t), nt = makeTripB(t), after = analyze(nt);
    const d = after.rec.mid.cost - before.rec.mid.cost;
    state.ai.pending = nt;
    return `<span>第二周在意大利连着换了 4 个城市。建议去掉佛罗伦萨，从威尼斯直达罗马，威尼斯多住 1 晚、罗马多住 2 晚。这样少坐一段火车，也少订一次座。</span>
      <div class="diff"><div class="diff-head">改动预览</div>
        <div class="diff-row del"><span class="op">−</span><span class="txt">佛罗伦萨（3晚）</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>威尼斯 2晚 → 3晚</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>罗马 7/25 到达 3晚 → 7/23 到达 5晚</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>威尼斯 → 罗马 改为直达 FR 9425</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>火车 ${t.segs.length}段 → ${nt.segs.length}段</span></div>
        <div class="diff-cost"><span>预计总花费（规则引擎计算）</span><span><span class="num">${eur(before.rec.mid.cost)} → ${eur(after.rec.mid.cost)}</span> ${d < 0 ? `省 ${eur(-d)}` : `多 ${eur(d)}`}</span></div>
        <div class="diff-actions"><button class="btn btn-sm btn-primary" data-act="ai-apply">应用改动</button><button class="btn btn-sm" data-act="ai-reject">不要</button></div>
      </div>`;
  }
  if (key === 'strike') return `<span>我联网查了 2 个来源：目前还看不到 2027 年 7 月下旬意大利全国性铁路罢工的公告。意大利公共服务罢工需要至少提前 10 天公布，出发前一周再查一次比较稳妥。</span>
      <div class="sources"><span class="muted xs">来源</span><a href="https://scioperi.mit.gov.it/" target="_blank" rel="noopener">意大利交通部罢工日历 ${ic('ext', 'ico-sm')}</a><a href="https://www.trenitalia.com/en.html" target="_blank" rel="noopener">Trenitalia 官网公告 ${ic('ext', 'ico-sm')}</a></div>
      <span class="xs muted">原型示例回复，不代表真实查询结果</span>`;
  if (key === 'why') {
    const days = dayChoices(t).filter(d => d.choice === 'ticket');
    if (!days.length) return `<span>现在所有能用通票的日子都用了旅行日，没有建议单独买票的日子。柏林 → 慕尼黑那天是因为在居住国境内，只能买票。</span>`;
    const d = days[0], s = d.segs[0];
    const top = dayChoices(t).filter(x => x.choice === 'pass').sort((a, b) => b.value - a.value).slice(0, 2);
    return `<span>${fmtMD(d.date)} ${stopName(t, s.after)} → ${nextStop(t, s.after).zh}：单独买票约 ${eur(s.p.mid)}，用通票还要付订座费 ${eur(s.fee)}，只省 ${eur(d.value)}。</span>
      <span>你的 ${passById(t.passId).name} 只有 ${passById(t.passId).days} 个旅行日，留给更值钱的日子更划算，比如 ${top.map(x => `${fmtMD(x.date)}（省 ${eur(x.value)}）`).join('、')}。</span>
      <span class="small muted">这些数字来自规则引擎，可以在<a href="#days">旅行日</a>页面自己切换试试。</span>`;
  }
  return `<span>原型里只演示下面三个常用问题。正式版会把你的问题和当前行程一起发给你选的 AI 服务商。</span>`;
}

/* ---------- 提示条 ---------- */
let toastTimer = null;
function toast(msg, undo) {
  const el = $('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">${ic('undo', 'ico-sm')} 撤销</button>` : ''}`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 10000 : 3000);
}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  const t = state.trip;
  switch (a) {
    case 'open-trip': go('route'); break;
    case 'toast': toast(b.dataset.msg); break;
    case 'src': e.stopPropagation(); e.preventDefault(); state.sheet = { type: 'src', src: b.dataset.src }; renderSheet(); break;
    case 'seg': state.sheet = { type: 'seg', id: b.dataset.id, mode: 'search' }; renderSheet(); break;
    case 'sheet-close': state.sheet = null; renderSheet(); break;
    case 'seg-mode': state.sheet.mode = b.dataset.v; renderSheet(); break;
    case 'pick': {
      const s = t.segs.find(x => x.id === state.sheet.id);
      Object.assign(s, { dep: b.dataset.dep, arr: b.dataset.arr, num: b.dataset.num });
      render(); toast('已换成 ' + s.num); break;
    }
    case 'price-save': {
      const v = parseFloat($('price-in').value);
      if (!(v > 0)) { toast('请输入大于 0 的价格'); break; }
      const s = t.segs.find(x => x.id === b.dataset.id);
      s.p = { min: v, mid: v, max: v }; s.src = 'user';
      t.passId = null; t.overrides = {}; ensurePass(t);
      render(); toast('已更新价格，费用和推荐方案已重新计算'); break;
    }
    case 'ai-price':
      if (!state.prefs.key) toast('需要先在设置中填入 API key');
      else toast(b.dataset.mode === 'est' ? '原型：AI 会估算价格区间' : '原型：AI 会联网查价格并附来源');
      break;
    case 'day': {
      const d = b.dataset.date;
      const cur = dayChoices(t).find(x => x.date === d).choice;
      t.overrides[d] = cur === 'pass' ? 'ticket' : 'pass';
      state.flash = '#day-' + d; render(); break;
    }
    case 'days-reset': t.overrides = {}; render(); toast('已恢复推荐安排'); break;
    case 'use-pass': t.passId = b.dataset.id; t.overrides = {}; render(); toast('已改用 ' + passById(t.passId).name); break;
    case 'res-open': state.openRes = b.dataset.id || null; render(); if (state.openRes) { const i = $('rf-ref-' + state.openRes); if (i) i.focus(); } break;
    case 'res-save': {
      const s = t.segs.find(x => x.id === b.dataset.id);
      s.resStatus = 'booked';
      s.booking = { ref: $('rf-ref-' + s.id).value.trim(), seat: $('rf-seat-' + s.id).value.trim(), paid: parseFloat($('rf-paid-' + s.id).value) || s.fee };
      state.openRes = null; render(); toast('已标记为已订'); break;
    }
    case 'res-ticket': { const s = t.segs.find(x => x.id === b.dataset.id); t.overrides[s.date] = 'ticket'; render(); toast('这段改为单独买票，费用已重新计算'); break; }
    case 'ai-toggle': state.aiOpen = !state.aiOpen; render(); if (state.aiOpen) { const i = $('aiInput'); if (i && window.innerWidth >= 1024) i.focus(); } break;
    case 'ai-q': { const q = QUICK.find(x => x[0] === b.dataset.k); aiAsk(q[0], q[1]); break; }
    case 'ai-stop': clearTimeout(state.ai.timer); state.ai.busy = false; state.ai.msgs.push({ role: 'ai', html: '<span class="muted">已停止。</span>' }); render(); break;
    case 'ai-apply': {
      if (!state.ai.pending) break;
      state.prevTrip = clone(t);
      state.trip = state.ai.pending; ensurePass(state.trip); state.ai.pending = null;
      const last = state.ai.msgs[state.ai.msgs.length - 1];
      last.html = last.html.replace(/<div class="diff-actions">[\s\S]*?<\/div>/, '<div class="diff-actions"><span class="status-ok">已应用</span></div>');
      render(); toast('已应用 5 项改动', true); break;
    }
    case 'ai-reject': {
      state.ai.pending = null;
      const last = state.ai.msgs[state.ai.msgs.length - 1];
      last.html = last.html.replace(/<div class="diff-actions">[\s\S]*?<\/div>/, '<div class="diff-actions"><span class="small muted">没有应用</span></div>');
      render(); break;
    }
    case 'undo':
      if (state.prevTrip) { state.trip = state.prevTrip; state.prevTrip = null; render(); toast('已撤销'); }
      break;
    case 'wz': state.wizard[b.dataset.k] = b.dataset.v; render(); break;
    case 'wz-count': state.wizard.count = Math.min(9, Math.max(1, state.wizard.count + Number(b.dataset.d))); render(); break;
    case 'wz-step': {
      const d = $('wz-desc'); if (d) state.wizard.desc = d.value;
      state.wizard.step += Number(b.dataset.d); render(); break;
    }
    case 'wz-gen': toast('原型：AI 会根据描述生成路线，生成后你可以逐项修改'); break;
    case 'wz-create': state.wizard.step = 1; go('route'); toast('原型中使用示例行程'); break;
    case 'pf-show': savePrefInputs(); state.prefs.show = !state.prefs.show; render(); break;
    case 'pf-test': {
      savePrefInputs();
      if (!state.prefs.key) { state.prefs.test = 'nokey'; render(); break; }
      state.prefs.test = 'busy'; render();
      setTimeout(() => { state.prefs.test = 'ok'; render(); }, 800); break;
    }
    case 'pf-clear-key': state.prefs.key = ''; state.prefs.test = null; render(); toast('已清除 key'); break;
    case 'pf-encrypt': state.prefs.encrypt = b.checked; break;
    case 'theme': {
      state.prefs.theme = b.dataset.v;
      if (b.dataset.v === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', b.dataset.v);
      render(); break;
    }
    case 'pf-confirm': state.prefs.confirmClear = b.dataset.v === '1'; render(); break;
    case 'pf-clear-all': state.prefs.confirmClear = false; render(); toast('原型：不会真的清除数据'); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'prov') {
    savePrefInputs();
    state.prefs.provider = el.value;
    state.prefs.model = { deepseek: 'deepseek-chat', claude: 'claude-sonnet-5-5', custom: '' }[el.value];
    state.prefs.test = null; render();
  }
  if (el.dataset.act === 'wz-country') state.wizard.country = el.value;
});
document.addEventListener('input', e => {
  if (e.target.id === 'pf-key') { state.prefs.key = e.target.value; }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.act !== 'ai-form') return;
  e.preventDefault();
  const v = $('aiInput').value.trim();
  if (!v) return;
  const k = /赶|少去|减少|太累/.test(v) ? 'crowded' : /罢工|停运/.test(v) ? 'strike' : /为什么|买票/.test(v) ? 'why' : 'other';
  aiAsk(k, v);
});
$('sheetBackdrop').addEventListener('click', e => { if (e.target.id === 'sheetBackdrop') { state.sheet = null; renderSheet(); } });
document.addEventListener('keydown', e => {
  const rb = e.target.closest && e.target.closest('[role="button"][data-act]');
  if (rb && e.target === rb && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); rb.click(); return; }
  if (e.key !== 'Escape') return;
  if (state.sheet) { state.sheet = null; renderSheet(); }
  else if (state.aiOpen && window.innerWidth < 1024) { state.aiOpen = false; render(); }
});
function savePrefInputs() {
  const k = $('pf-key'), m = $('pf-model'), base = $('pf-base');
  if (k) state.prefs.key = k.value;
  if (m) state.prefs.model = m.value;
  if (base) state.prefs.base = base.value;
}

window.addEventListener('hashchange', () => { state.sheet = null; render(); window.scrollTo(0, 0); });
render();
})();
</script>
