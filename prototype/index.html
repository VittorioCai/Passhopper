<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Passhopper 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* 布局：手机为玻璃顶栏 + 内容 + 悬浮胶囊标签栏；≥1024px 为左侧导航 + 内容 + 右侧 AI 面板。
   视觉：通票做成手机钱包里的交通卡（日落渐变），路线做成地铁线路图（每个国家一种线路色），大圆角、柔和阴影。 */
:root {
  --bg: #F3F5F9; --blob-a: rgba(255, 106, 61, .18); --blob-b: rgba(47, 107, 255, .13); --blob-c: rgba(15, 169, 122, .10);
  --surface: #FFFFFF; --surface-2: #EEF1F6; --surface-3: #E2E7EF; --line: #E3E7EE;
  --ink: #0F1524; --ink-2: #5A6478; --ink-3: #8C95A7; --on-ink: #FFFFFF;
  --primary: #FF5A36; --primary-ink: #FFFFFF; --primary-soft: #FFE8E1;
  --blue: #2F6BFF; --blue-soft: #E4ECFF;
  --mint: #0C9F72; --mint-soft: #DCF5EB;
  --sun: #FFB400; --sun-ink: #2A1D00; --sun-text: #8A5A00; --sun-soft: #FFF2CC;
  --danger: #E23B3E; --danger-soft: #FDE5E5;
  --glass: rgba(255, 255, 255, .72); --glass-line: rgba(255, 255, 255, .9);
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 28px rgba(16, 24, 40, .07);
  --shadow-lg: 0 18px 50px rgba(16, 24, 40, .16);
  --scrim: rgba(10, 14, 22, .45);
  --pass-grad: linear-gradient(135deg, #FF4D3A 0%, #FF7A2F 48%, #FFB648 100%);
  --ai-grad: linear-gradient(135deg, #FF5A36, #FFB648);
  --l-DE: #2F6BFF; --l-CH: #E23B3E; --l-IT: #0C9F72; --l-AT: #E8641C; --l-CZ: #7C5CFA; --on-line: #FFFFFF;
  --f-body: "DM Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-display: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC", sans-serif;
  --f-mono: "DM Mono", ui-monospace, monospace;
  --r-md: 16px; --r-lg: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E14; --blob-a: rgba(255, 106, 61, .14); --blob-b: rgba(91, 140, 255, .10); --blob-c: rgba(45, 212, 160, .07);
    --surface: #151A23; --surface-2: #1C2230; --surface-3: #262E3E; --line: #252C3A;
    --ink: #F1F3F8; --ink-2: #A3ACBD; --ink-3: #6E7789; --on-ink: #0B0E14;
    --primary: #FF6A47; --primary-ink: #FFFFFF; --primary-soft: #3A1E17;
    --blue: #6B96FF; --blue-soft: #172341;
    --mint: #2DD4A0; --mint-soft: #0E2D24;
    --sun: #FFC444; --sun-ink: #2A1D00; --sun-text: #FFC444; --sun-soft: #33290C;
    --danger: #FF6B6B; --danger-soft: #3A1B1D;
    --glass: rgba(21, 26, 35, .72); --glass-line: rgba(255, 255, 255, .06);
    --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 8px 28px rgba(0, 0, 0, .35);
    --shadow-lg: 0 18px 50px rgba(0, 0, 0, .5);
    --scrim: rgba(0, 0, 0, .6);
    --l-DE: #5B8CFF; --l-CH: #FF6B6B; --l-IT: #2DD4A0; --l-AT: #FF9A55; --l-CZ: #A08BFF; --on-line: #0B0E14;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E14; --blob-a: rgba(255, 106, 61, .14); --blob-b: rgba(91, 140, 255, .10); --blob-c: rgba(45, 212, 160, .07);
  --surface: #151A23; --surface-2: #1C2230; --surface-3: #262E3E; --line: #252C3A;
  --ink: #F1F3F8; --ink-2: #A3ACBD; --ink-3: #6E7789; --on-ink: #0B0E14;
  --primary: #FF6A47; --primary-ink: #FFFFFF; --primary-soft: #3A1E17;
  --blue: #6B96FF; --blue-soft: #172341;
  --mint: #2DD4A0; --mint-soft: #0E2D24;
  --sun: #FFC444; --sun-ink: #2A1D00; --sun-text: #FFC444; --sun-soft: #33290C;
  --danger: #FF6B6B; --danger-soft: #3A1B1D;
  --glass: rgba(21, 26, 35, .72); --glass-line: rgba(255, 255, 255, .06);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 8px 28px rgba(0, 0, 0, .35);
  --shadow-lg: 0 18px 50px rgba(0, 0, 0, .5);
  --scrim: rgba(0, 0, 0, .6);
  --l-DE: #5B8CFF; --l-CH: #FF6B6B; --l-IT: #2DD4A0; --l-AT: #FF9A55; --l-CZ: #A08BFF; --on-line: #0B0E14;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(60px); }
.blobs i:nth-child(1) { width: 420px; height: 420px; background: var(--blob-a); top: -140px; right: -120px; }
.blobs i:nth-child(2) { width: 380px; height: 380px; background: var(--blob-b); top: 38%; left: -180px; }
.blobs i:nth-child(3) { width: 320px; height: 320px; background: var(--blob-c); bottom: -120px; right: 10%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); text-decoration: none; font-weight: 500; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 14px; }
.xs { font-size: 12px; }
.ico { width: 20px; height: 20px; flex: none; }
.ico-sm { width: 16px; height: 16px; flex: none; vertical-align: -3px; }

/* ---------- 外框 ---------- */
.app { min-height: 100%; }
.sidenav { display: none; }
.main-col { min-width: 0; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 8px; min-height: 60px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border-bottom: 1px solid var(--line);
}
.topbar .title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.02em; color: var(--ink); }
.logo svg { width: 30px; height: 30px; flex: none; }
.logo small { font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--ink-2); letter-spacing: 0; }
.proto-chip { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; border: 0; background: transparent; border-radius: 999px; color: var(--ink); }
.icon-btn:hover { background: var(--surface-2); }
.ai-btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 6px; border-radius: 999px; border: 0; background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 14px; white-space: nowrap; }
.ai-btn .orb { width: 26px; height: 26px; border-radius: 50%; background: var(--ai-grad); display: inline-grid; place-items: center; color: #fff; }
.ai-btn[aria-pressed="true"] { background: var(--primary); color: #fff; }

.view {
  max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px;
  padding-block: 18px 128px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(420px, calc(100% - 32px));
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px;
  background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(20px); backdrop-filter: saturate(1.6) blur(20px);
  border: 1px solid var(--glass-line); border-radius: 999px; box-shadow: var(--shadow-lg);
}
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 52px; border-radius: 999px; font-size: 11px; font-weight: 500; color: var(--ink-2); text-decoration: none; transition: background .18s, color .18s; }
.tabbar a[aria-current="page"] { background: var(--ink); color: var(--on-ink); font-weight: 700; }

@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 248px minmax(0, 1fr) auto; }
  .sidenav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .sidenav .logo { padding: 0 8px 14px; }
  .sidenav .tripname { padding: 18px 10px 6px; font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .06em; }
  .sidenav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 500; }
  .sidenav a:hover { background: var(--surface-2); }
  .sidenav a[aria-current="page"] { background: var(--ink); color: var(--on-ink); font-weight: 700; }
  .sidenav .spacer { flex: 1; }
  .tabbar { display: none; }
  .view { padding-block: 28px 56px; }
  .topbar .back { display: none; }
}

/* ---------- 通用 ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); }
.h-sec { font-family: var(--f-display); font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; display: flex; align-items: baseline; gap: 8px; }
.h-sec .cnt { font-size: 14px; color: var(--ink-3); font-weight: 700; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--surface-2); font-weight: 700; font-size: 15px; color: var(--ink); text-decoration: none; transition: transform .12s, filter .12s; white-space: nowrap; }
.btn:hover { text-decoration: none; filter: brightness(.97); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: var(--primary-ink); box-shadow: 0 6px 18px rgba(255, 90, 54, .32); }
.btn-ink { background: var(--ink); color: var(--on-ink); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { background: transparent; color: var(--primary); padding: 0 10px; }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.btn-block { width: 100%; }

.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 999px; white-space: nowrap; border: 0; }
button.badge { cursor: pointer; }
.src-official { background: var(--mint-soft); color: var(--mint); }
.src-live { background: var(--blue-soft); color: var(--blue); }
.src-user { background: var(--surface-3); color: var(--ink); }
.src-ai_estimate { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1.2px var(--ink-3); }
.src-ai_search { background: transparent; color: var(--blue); box-shadow: inset 0 0 0 1.2px var(--blue); }
.src-stale { background: var(--sun-soft); color: var(--sun-text); }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.chip-must { background: var(--danger-soft); color: var(--danger); }
.chip-rec { background: var(--sun-soft); color: var(--sun-text); }
.chip-none { background: var(--surface-2); color: var(--ink-2); }
.chip-pass { background: var(--sun); color: var(--sun-ink); }
.chip-ticket { background: var(--surface-2); color: var(--ink); }
.chip-ok { background: var(--mint-soft); color: var(--mint); }

.cc { display: inline-grid; place-items: center; min-width: 26px; height: 20px; padding: 0 5px; border-radius: 6px; font-size: 11px; font-weight: 800; color: var(--on-line); letter-spacing: .02em; font-family: var(--f-display); }

.note { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r-md); font-size: 14px; background: var(--surface); box-shadow: var(--shadow); }
.note .ib { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.note-info .ib { background: var(--blue-soft); color: var(--blue); }
.note-warn .ib { background: var(--sun-soft); color: var(--sun-text); }
.note-danger { box-shadow: inset 0 0 0 1.5px var(--danger), var(--shadow); }
.note-danger .ib { background: var(--danger-soft); color: var(--danger); }
.note > span:last-child { padding-top: 5px; }

.foot-note { font-size: 12px; color: var(--ink-3); text-align: center; padding-top: 10px; line-height: 1.7; }

/* ---------- 通票卡 ---------- */
.passcard { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 20px; color: #fff; background: var(--pass-grad); box-shadow: 0 16px 40px rgba(255, 90, 54, .28); isolation: isolate; }
.passcard::before { content: ""; position: absolute; inset: 0; z-index: -1; background:
  radial-gradient(circle at 85% 15%, rgba(255,255,255,.35), transparent 40%),
  repeating-linear-gradient(115deg, rgba(255,255,255,.08) 0 2px, transparent 2px 14px); }
.passcard::after { content: ""; position: absolute; right: -60px; bottom: -80px; width: 220px; height: 220px; border-radius: 50%; border: 28px solid rgba(255,255,255,.14); z-index: -1; }
.pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.pc-kicker { font-size: 11px; font-weight: 800; letter-spacing: .14em; opacity: .9; }
.pc-name { font-family: var(--f-display); font-size: 24px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.pc-who { font-size: 12px; font-weight: 700; background: rgba(255,255,255,.22); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.pc-big { font-family: var(--f-display); font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -.03em; margin-top: 18px; font-variant-numeric: tabular-nums; }
.pc-big small { font-size: 20px; font-weight: 700; letter-spacing: 0; margin-right: 4px; }
.pc-sub { font-size: 13px; opacity: .95; margin-top: 6px; }
.pc-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px 12px; margin-top: 18px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.3); }
.dots i.on { background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
.dots i.over { background: #2A0B05; }
.pc-valid { font-size: 12px; font-weight: 700; opacity: .95; }

/* ---------- 首页 ---------- */
.hello { display: flex; flex-direction: column; gap: 2px; padding: 6px 2px 0; }
.hello .k { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.hello h1 { font-family: var(--f-display); font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.hello h1 em { font-style: normal; background: var(--pass-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.trip-card { display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: transform .15s; }
.trip-card:hover { transform: translateY(-2px); }
.trip-card h3 { font-family: var(--f-display); font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.mini-line { display: flex; align-items: center; }
.mini-line .st { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); flex: none; }
.mini-line .ln { height: 5px; flex: 1; }
.city-row { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 13px; color: var(--ink-2); }
.city-row span:not(:last-child)::after { content: "·"; margin-left: 6px; color: var(--ink-3); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--ink-2); }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--mint); border-radius: 999px; }
.ghost-card { border: 2px dashed var(--surface-3); background: transparent; box-shadow: none; }

/* ---------- 路线 ---------- */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.qs { display: flex; flex-direction: column; padding: 10px 12px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
.qs b { font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.1; }
.qs span { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.timeline { display: flex; flex-direction: column; }
.stop { display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 12px; }
.stop .rail { position: relative; }
.stop .rail::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 6px; border-radius: 3px; background: var(--lc, var(--surface-3)); }
.stop.first .rail::before { top: 16px; }
.stop.last .rail::before { top: 0; bottom: auto; height: 16px; background: var(--lc-prev, var(--surface-3)); }
.stop .dot { position: absolute; left: 3px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 5px solid var(--ink); z-index: 1; }
.stop.home .dot { background: var(--ink); border-color: var(--ink); box-shadow: 0 0 0 4px var(--surface-3); }
.stop-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stop-head .city { font-family: var(--f-display); font-size: 24px; font-weight: 800; letter-spacing: -.02em; line-height: 1.3; }
.stop-head .local { font-size: 14px; color: var(--ink-3); font-weight: 500; }
.stop-head .stop-tools { margin-left: auto; display: inline-flex; gap: 6px; }
.stop-tools button { width: 32px; height: 32px; border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 50%; color: var(--ink-2); display: inline-grid; place-items: center; }
.stop-when { font-size: 14px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.nights { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface); box-shadow: var(--shadow); color: var(--ink); }
.stop-body { padding: 10px 0 24px; display: flex; flex-direction: column; gap: 8px; }
.stop-note { font-size: 13px; color: var(--ink-3); }

.ticket { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); cursor: pointer; display: block; transition: transform .15s, box-shadow .15s; }
.ticket:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.ticket.problem { box-shadow: inset 0 0 0 1.5px var(--sun), var(--shadow); }
.ticket-main { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.ticket-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.train { display: inline-flex; align-items: center; gap: 5px; font-family: var(--f-display); font-weight: 800; font-size: 14px; letter-spacing: .02em; padding: 5px 10px; border-radius: 999px; color: var(--on-line); background: var(--lc, var(--ink)); white-space: nowrap; }
.times { font-family: var(--f-display); font-weight: 800; font-size: 24px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.times .arr { color: var(--ink-3); font-weight: 500; }
.times sup { font-size: 12px; color: var(--primary); font-weight: 800; }
.stations { font-size: 14px; color: var(--ink-2); }

/* ================= 规则引擎（原型简化版，对应开发文档 §3） ================= */
function dayMap(trip, k) {
  const m = new Map();
  for (const s of trip.segs) {
    if (!m.has(s.date)) m.set(s.date, { date: s.date, segs: [] });
    m.get(s.date).segs.push(s);
  }
  for (const d of m.values()) {
    const cov = d.segs.filter(s => !s.home);
    d.coverable = cov.length > 0;
    d.value = cov.reduce((a, s) => a + s.p[k] - s.fee, 0);
    d.night = d.segs.some(s => s.night);
  }
  return [...m.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
}
const ticketsTotal = (trip, k) => trip.segs.reduce((a, s) => a + s.p[k], 0);
function bestFor(pass, trip, k) {
  const days = dayMap(trip, k).filter(d => d.coverable && d.value > 0);
  const dates = trip.segs.map(s => s.date).sort();
  let best = { savings: 0, chosen: [] };
  for (let s = dates[0]; s <= dates[dates.length - 1]; s = addDays(s, 1)) {
    const end = addDays(s, pass.validity - 1);
    const inW = days.filter(d => d.date >= s && d.date <= end && !(d.date === end && d.night));
    const chosen = pass.kind === 'flexi' ? [...inW].sort((a, b) => b.value - a.value).slice(0, pass.days) : inW;
    const sv = chosen.reduce((a, d) => a + d.value, 0);
    if (sv > best.savings) best = { savings: sv, chosen: chosen.map(d => d.date).sort() };
  }
  return { ...best, cost: pass.price + ticketsTotal(trip, k) - best.savings };
}
function analyze(trip) {
  const plans = PASSES.map(p => ({
    pass: p, mid: bestFor(p, trip, 'mid'), min: bestFor(p, trip, 'min'), max: bestFor(p, trip, 'max')
  })).sort((a, b) => a.mid.cost - b.mid.cost);
  const tickets = { min: ticketsTotal(trip, 'min'), mid: ticketsTotal(trip, 'mid'), max: ticketsTotal(trip, 'max') };
  return { plans, tickets, rec: plans[0] };
}
function ensurePass(trip) { if (!trip.passId) trip.passId = analyze(trip).rec.pass.id; }
function dayChoices(trip) {
  ensurePass(trip);
  const pass = passById(trip.passId);
  const opt = bestFor(pass, trip, 'mid');
  return dayMap(trip, 'mid').map(d => {
    const c = !d.coverable ? 'home' : (trip.overrides[d.date] || (opt.chosen.includes(d.date) ? 'pass' : 'ticket'));
    return { ...d, choice: c };
  });
}
function currentCost(trip) {
  const pass = passById(trip.passId);
  const days = dayChoices(trip);
  let fees = 0, tix = 0; const feeSegs = [], tixSegs = [];
  for (const d of days) for (const s of d.segs) {
    if (d.choice === 'pass' && !s.home) { fees += s.fee; if (s.fee) feeSegs.push(s); }
    else { tix += s.p.mid; tixSegs.push(s); }
  }
  const passDays = days.filter(d => d.choice === 'pass');
  const errors = [];
  if (pass.kind === 'flexi' && passDays.length > pass.days) errors.push(`选了 ${passDays.length} 个旅行日，${pass.name} 只有 ${pass.days} 天。`);
  if (passDays.length > 1) {
    const sp = span(passDays[0].date, passDays[passDays.length - 1].date) + 1;
    if (sp > pass.validity) errors.push(`第一个和最后一个旅行日跨了 ${sp} 天，超过了通票 ${pass.validity} 天的有效期。`);
  }
  return { pass, days, passDays, fees, tix, feeSegs, tixSegs, total: pass.price + fees + tix, errors };
}
function segChoice(trip, s) {
  const d = dayChoices(trip).find(x => x.date === s.date);
  return s.home ? 'home' : d.choice;
}

    <div class="pc-foot"><div class="dots" aria-label="已用 ${used} 个旅行日">${dots}</div><span class="pc-valid">${pass.kind === 'flexi' ? `${used}/${pass.days} 旅行日 · ` : ''}${fmtMD(winStart)}–${fmtMD(addDays(winStart, pass.validity - 1))} 有效</span></div>
  </div>`;
}

/* ---------- 首页 ---------- */
function viewHome() {
  const t = state.trip;
  const today = new Date(); const todayS = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())).toISOString().slice(0, 10);
  const start = t.stops[0].date, end = t.stops[t.stops.length - 1].date;
  const left = span(todayS, start);
  const cc = currentCost(t);
  const resNeed = t.segs.filter(s => (s.res === 'mandatory' || s.res === 'recommended') && segChoice(t, s) === 'pass');
  const resDone = resNeed.filter(s => s.resStatus === 'booked').length;
  const line = t.segs.map((s, i) => `${i === 0 ? '<span class="st"></span>' : ''}<span class="ln" style="background:${lc(s.cc)}"></span><span class="st"></span>`).join('');
  return `
  <div class="hello"><span class="k">嗨，旅行者</span><h1>${left > 0 ? `还有 <em>${left} 天</em>出发` : '旅途愉快'}</h1></div>
  <div class="card trip-card" role="button" tabindex="0" data-act="open-trip">
    <div class="spread"><h3>${esc(t.name)}</h3><span class="chip chip-pass">${cc.pass.name}</span></div>
    <div class="mini-line" aria-hidden="true">${line}</div>
    <div class="city-row">${t.stops.slice(0, -1).map(s => `<span>${s.zh}</span>`).join('')}</div>
    <div class="stats">
      <div class="stat"><b>${fmtMD(start)}</b><span>出发 · 共${span(start, end) + 1}天</span></div>
      <div class="stat"><b>${t.stops.length - 2}</b><span>座城市</span></div>
      <div class="stat"><b>${eur(cc.total)}</b><span>预计花费</span></div>
    </div>
    <div class="stack" style="gap:6px"><div class="spread small"><span class="muted">订座进度</span><b>${resDone}/${resNeed.length}</b></div><div class="bar"><i style="width:${resNeed.length ? resDone / resNeed.length * 100 : 100}%"></i></div></div>
  </div>
  <div class="card ghost-card trip-card" role="button" tabindex="0" data-act="toast" data-msg="原型只包含一个完整的示例行程">
    <div class="spread"><h3 class="muted" style="font-size:18px">巴黎到布拉格 10 天</h3><span class="badge src-ai_estimate">示例</span></div>
    <div class="city-row"><span>5 座城市</span><span>4 段火车</span><span>还没选通票</span></div>
  </div>
  <a class="btn btn-primary btn-block" href="#new">${ic('plus')}新建行程</a>`;
}

/* ---------- 新建行程 ---------- */
function viewNew() {
  const w = state.wizard;
  const segBtns = (key, opts) => `<div class="seg-ctl" role="group">${opts.map(o => `<button data-act="wz" data-k="${key}" data-v="${o[0]}" aria-pressed="${w[key] === o[0]}">${o[1]}</button>`).join('')}</div>`;
  const titles = ['', '先认识一下你', '想去哪里？', '什么时候出发？'];
  let body = '';
  if (w.step === 1) body = `
    <div class="stack"><span class="lbl">住在哪里</span>
      ${segBtns('resType', [['europe', '欧洲'], ['non', '欧洲以外']])}
      ${w.resType === 'europe' ? `<label class="field">居住国家<select id="wz-country" data-act="wz-country">${['德国', '法国', '荷兰', '英国', '意大利', '西班牙', '奥地利', '瑞士', '比利时', '其他'].map(c => `<option ${c === w.country ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      <div class="note note-info"><span class="ib">${ic('info', 'ico-sm')}</span><span>欧洲居民在居住国内只能用通票出境 1 次、入境 1 次，其他国内段需要单独买票。我们会自动帮你判断。</span></div>`
      : `<div class="note note-info"><span class="ib">${ic('info', 'ico-sm')}</span><span>欧洲以外的居民不受居住国规则限制，所有参与国家都能使用通票。</span></div>`}
    </div>
    <div class="stack"><span class="lbl">年龄段</span>${segBtns('age', [['青年', '青年 12–27'], ['成人', '成人 28–59'], ['老人', '老人 60+']])}</div>
    <div class="stack"><span class="lbl">舱等</span>${segBtns('cls', [['二等', '二等座'], ['一等', '一等座']])}</div>
    <div class="spread"><span class="lbl">几个人</span>
      <div class="stepper"><button data-act="wz-count" data-d="-1" aria-label="减少">−</button><span aria-live="polite">${w.count}</span><button data-act="wz-count" data-d="1" aria-label="增加">+</button></div></div>`;
  if (w.step === 2) body = `
    <label class="field">用一句话描述，AI 帮你排路线
      <textarea id="wz-desc" placeholder="例如：7月从柏林出发玩三周，想去意大利，最后经维也纳和布拉格回来">${esc(w.desc)}</textarea></label>
    ${state.prefs.key ? `<button class="btn btn-primary" data-act="wz-gen">${ic('spark', 'ico-sm')}生成路线</button>`
      : `<div class="note note-warn"><span class="ib">${ic('spark', 'ico-sm')}</span><span>在设置里填入 API key 后就能用 AI 生成路线。<a href="#prefs">去设置</a></span></div>`}
    <div class="or">或者自己添加城市</div>
    <div class="pill-list">${['柏林', '慕尼黑', '苏黎世'].map(c => `<span class="pill">${c}</span>`).join('')}<button class="pill" data-act="toast" data-msg="原型中暂不支持添加城市">${ic('plus', 'ico-sm')}添加</button></div>`;
  if (w.step === 3) body = `
    <label class="field">出发日期<input type="date" id="wz-date" value="2027-07-14"></label>
    <p class="small muted" style="margin:0">每个城市住几晚，创建后在路线页随时可以改。</p>`;
  return `
  <div class="stack" style="gap:8px"><div class="wz-progress"><i style="width:${w.step / 3 * 100}%"></i></div><span class="wz-step">第 ${w.step} 步 / 共 3 步</span><h1 class="wz-title">${titles[w.step]}</h1></div>
  <div class="card stack" style="gap:20px">${body}</div>
  <div class="spread">
    ${w.step > 1 ? `<button class="btn" data-act="wz-step" data-d="-1">上一步</button>` : '<span></span>'}
    ${w.step < 3 ? `<button class="btn btn-ink" data-act="wz-step" data-d="1">下一步</button>` : `<button class="btn btn-primary" data-act="wz-create">创建行程</button>`}
  </div>`;
}

/* ---------- 路线 ---------- */
function viewRoute() {
  const t = state.trip;
  const cc = currentCost(t);
  const resTodo = t.segs.filter(s => (s.res === 'mandatory' || s.res === 'recommended') && segChoice(t, s) === 'pass' && s.resStatus !== 'booked');
  const days = span(t.stops[0].date, t.stops[t.stops.length - 1].date) + 1;
  const notes = [];
  t.segs.filter(s => s.home).forEach(s => notes.push(['info', 'info', `<b>${stopName(t, s.after)} → ${nextStop(t, s.after).zh}</b> 在居住国${t.traveller.country}境内，当天没有出境，不能用通票，需要单独买票。`]));
  if (resTodo.length) notes.push(['warn', 'seat', `还有 <b>${resTodo.length} 段</b>没订座，夜车卧铺很抢手。<a href="#reservations">去订座</a>`]);
  cc.errors.forEach(e => notes.push(['danger', 'alert', e + ' <a href="#days">去调整</a>']));

  const stopsHtml = t.stops.map((s, i) => {
    const sg = t.segs.find(x => x.after === s.id);
    const prev = i > 0 ? t.segs.find(x => x.after === t.stops[i - 1].id) : null;
    const first = i === 0, last = i === t.stops.length - 1;
    const when = s.role === 'start' ? `${fmtLong(s.date)} 出发` : s.role === 'end' ? `${fmtLong(s.date)} 到达` : fmtLong(s.date);
    const style = `${sg ? `--lc:${lc(sg.cc)};` : ''}${prev ? `--lc-prev:${lc(prev.cc)};` : ''}`;
    return `<div class="stop ${first ? 'first' : ''} ${last ? 'last' : ''} ${s.role ? 'home' : ''}" id="stop-${s.id}" style="${style}">
      <div class="rail"><span class="dot"></span></div>
      <div>
        <div class="stop-head"><span class="city">${s.zh}</span><span class="local">${s.local}</span>${ccBadge(s.cc)}
          ${!s.role ? `<span class="stop-tools"><button data-act="toast" data-msg="原型：上移城市" aria-label="上移 ${s.zh}">${ic('up', 'ico-sm')}</button><button data-act="toast" data-msg="原型：下移城市" aria-label="下移 ${s.zh}">${ic('down', 'ico-sm')}</button></span>` : ''}</div>
        <div class="stop-when">${when}${!s.role ? `<span class="nights">${s.nights} 晚</span>` : ''}</div>
        <div class="stop-body">
          ${s.note ? `<div class="stop-note">${s.note}</div>` : ''}
          ${sg ? ticketHtml(t, sg) : ''}
        </div>
      </div></div>`;
  }).join('');

  return `
  ${passCard(t)}
  <div class="quick">
    <div class="qs"><b>${t.stops.length - 2}</b><span>座城市</span></div>
    <div class="qs"><b>${days}</b><span>天</span></div>
    <div class="qs"><b>${t.segs.length}</b><span>段火车</span></div>
    <div class="qs"><b>${resTodo.length}</b><span>段待订座</span></div>
  </div>
  ${notes.map(([k, i, m]) => `<div class="note note-${k}"><span class="ib">${ic(i, 'ico-sm')}</span><span>${m}</span></div>`).join('')}
  <h2 class="h-sec">路线</h2>
  <div class="timeline">${stopsHtml}</div>
  <button class="btn btn-block" data-act="toast" data-msg="原型中暂不支持添加城市">${ic('plus')}添加城市</button>`;
}
function ticketHtml(t, s) {
  const c = segChoice(t, s);
  const choiceChip = c === 'pass' ? `<span class="chip chip-pass">用旅行日</span>` : `<span class="chip chip-ticket">单独买票</span>`;
  return `<div class="ticket ${s.home ? 'problem' : ''}" role="button" tabindex="0" data-act="seg" data-id="${s.id}" id="tk-${s.id}" style="--lc:${lc(s.cc)}" aria-label="${s.from}到${s.to}，${s.num}，查看详情">
    <div class="ticket-main">
      <div class="ticket-top"><span class="train">${s.night ? ic('moon', 'ico-sm') : ''}${s.num}</span>
        <span class="times">${s.dep}<span class="arr">→</span>${s.arr}${s.night ? '<sup>+1</sup>' : ''}</span></div>
      <div class="stations">${s.from} → ${s.to}</div>
      <div class="meta"><span>${s.dur}</span><span>·</span><span>直达</span>${s.night ? '<span>·</span><span class="tag">夜车</span>' : ''}${s.journey === 'out' ? '<span>·</span><span class="tag">出境行程</span>' : s.journey === 'in' ? '<span>·</span><span class="tag">入境行程</span>' : ''}</div>
    </div>
    <div class="perf"></div>
    <div class="ticket-foot">${choiceChip}${resChip(s)}${s.fee && c === 'pass' ? `<span class="small muted">订座 ${eur(s.fee)}</span>` : ''}
      <span class="price"><span class="xs faint">买票</span><b>${eurRange(s.p.min, s.p.max)}</b>${badge(s.src)}</span>
    </div>
  </div>`;
}

/* ---------- 旅行日 ---------- */
function viewDays() {
  const t = state.trip;
  const cc = currentCost(t);
  const a = analyze(t);
  const pass = cc.pass;
  const pd = cc.passDays;
  const winStart = pd.length ? pd[0].date : t.segs[0].date;
  const winEnd = addDays(winStart, pass.validity - 1);
  const over = pass.kind === 'flexi' && pd.length > pass.days;
  const rows = cc.days.map(d => {
    const segs = d.segs;
    const routeTxt = segs.map(s => `${s.night ? ic('moon', 'ico-sm') : ''}${stopName(t, s.after)} → ${nextStop(t, s.after).zh}`).join('<br>');
    let why = '', err = false;
    if (d.choice === 'home') why = `居住国内且当天不出境，只能买票 · 约 ${eur(segs[0].p.mid)}`;
    else if (d.choice === 'pass') {
      const fee = segs.reduce((x, s) => x + s.fee, 0);
      why = `买票约 ${eur(segs.reduce((x, s) => x + s.p.mid, 0))}${fee ? ` · 订座 ${eur(fee)}` : ''} · 用通票省 ${eur(d.value)}`;
      if (segs.some(s => s.journey === 'out')) why += ' · 出境';
      if (segs.some(s => s.journey === 'in')) why += ' · 入境';
      if (d.date > winEnd) { err = true; why = '不在通票有效期内'; }
      if (d.night && d.date === winEnd) { err = true; why = '有效期最后一天不能坐夜车'; }
    } else why = `买票约 ${eur(segs.reduce((x, s) => x + s.p.mid, 0))}，用通票只省 ${eur(d.value)}，旅行日留给更值的日子`;
    if (over && d.choice === 'pass') err = true;
    const dd = D(d.date);
    const sw = d.choice === 'home'
      ? `<button class="switch locked" data-act="toast" data-msg="居住国内且当天不出境的行程不能用通票" aria-label="${fmtMD(d.date)} 只能买票"><span>${ic('lock', 'ico-sm')}只能买票</span></button>`
      : `<button class="switch ${d.choice === 'pass' ? 'on' : ''}" role="switch" aria-checked="${d.choice === 'pass'}" data-act="day" data-date="${d.date}" aria-label="${fmtMD(d.date)} 用通票"><span>通票</span><span>买票</span></button>`;
    return `<div class="day is-${d.choice} ${err ? 'err' : ''}" id="day-${d.date}">
      <div class="datebox"><span class="m">${dd.getUTCMonth() + 1}月</span><span class="d">${dd.getUTCDate()}</span><span class="w">周${WD[dd.getUTCDay()]}</span></div>
      <div class="day-main"><div class="day-route">${routeTxt}</div>${sw}</div>
      <div class="day-why">${why}</div>
    </div>`;
  }).join('');
  const changed = Object.keys(t.overrides).length > 0;
  const recCost = bestFor(pass, t, 'mid').cost;
  return `
  ${passCard(t, `${pass.sub} · 有效期 ${fmtMD(winStart)}–${fmtMD(winEnd)} · 总花费 ${eur(cc.total)}`)}
  ${cc.errors.map(e => `<div class="note note-danger"><span class="ib">${ic('alert', 'ico-sm')}</span><span>${e}</span></div>`).join('')}
  <h2 class="h-sec">每天怎么用 <span class="cnt">${pd.length}/${pass.kind === 'flexi' ? pass.days : '—'} 个旅行日</span></h2>
  <div class="legend"><span><i style="background:var(--sun)"></i>用旅行日</span><span><i style="background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink-3)"></i>单独买票</span><span>拨动开关可以切换，花费实时重算</span></div>
  <div class="stack">${rows}</div>
  <div class="total-bar" aria-live="polite">
    <div><div class="l">当前安排总花费</div><div class="v">${eur(cc.total)}</div></div>
    ${changed ? `<div style="text-align:right"><div class="l">推荐安排 ${eur(recCost)}</div><button class="btn btn-sm btn-ghost" data-act="days-reset">${ic('undo', 'ico-sm')}恢复推荐</button></div>` : `<span class="chip chip-ok">${ic('check', 'ico-sm')}已是最省</span>`}
  </div>
  <div class="small muted">推荐的通票是 ${a.rec.pass.name}。想换别的通票，去<a href="#value">回本</a>页比较。</div>`;
}

/* ---------- 订座 ---------- */
function viewRes() {
  const t = state.trip;
  const items = t.segs.map(s => ({ s, c: segChoice(t, s) }));
  const need = items.filter(x => (x.s.res === 'mandatory' || x.s.res === 'recommended') && x.c === 'pass');
  const todo = need.filter(x => x.s.resStatus !== 'booked').sort((a, b) => (b.s.quota ? 1 : 0) - (a.s.quota ? 1 : 0));
  const booked = need.filter(x => x.s.resStatus === 'booked');
  const ticket = items.filter(x => x.s.res !== 'none' && x.c !== 'pass');
  const none = items.filter(x => x.c === 'pass' && (x.s.res === 'none' || x.s.res === 'optional'));
  const total = need.reduce((a, x) => a + x.s.fee, 0);
  const route = s => `${stopName(t, s.after)} → ${nextStop(t, s.after).zh}`;
  const pct = need.length ? booked.length / need.length : 1;
  const C = 2 * Math.PI * 34;
  const todoHtml = todo.map(({ s }) => {
    const open = state.openRes === s.id, lk = LINKS[s.cc];
    return `<div class="card res-item" id="res-${s.id}">
      <div class="top"><span class="train" style="--lc:${lc(s.cc)}">${s.night ? ic('moon', 'ico-sm') : ''}${s.num}</span>${s.quota ? `<span class="hot">${ic('alert', 'ico-sm')}抢手</span>` : ''}<span class="small muted" style="margin-left:auto">${fmtLong(s.date)}</span></div>
      <div class="route">${route(s)}</div>
      <div class="row">${resChip(s)}<span class="small">${s.fee ? '约 ' + eur(s.fee) : s.resNote}</span>${badge('official')}</div>
      ${s.resNote && s.fee ? `<div class="small muted">${s.resNote}</div>` : ''}
      ${s.quota ? `<div class="small" style="color:var(--primary);font-weight:500">${s.quota}，建议尽早订</div>` : ''}
      <div class="small">去哪订：<a href="${lk[1]}" target="_blank" rel="noopener">${lk[0]} ${ic('ext', 'ico-sm')}</a></div>
      ${open ? `<div class="res-form">
          <label class="field">订座号<input class="mono" id="rf-ref-${s.id}" placeholder="例如 K7Q2XB"></label>
          <label class="field">车厢和座位<input id="rf-seat-${s.id}" placeholder="例如 8车 6A"></label>
          <label class="field">实际花费（€）<input type="number" inputmode="decimal" id="rf-paid-${s.id}" value="${s.fee || ''}"></label>
        </div>
        <div class="row"><button class="btn btn-primary btn-sm" data-act="res-save" data-id="${s.id}">保存</button><button class="btn btn-sm" data-act="res-open" data-id="">取消</button></div>`
      : `<div class="row"><button class="btn btn-sm btn-ink" data-act="res-open" data-id="${s.id}">${ic('check', 'ico-sm')}标记为已订</button><button class="btn btn-sm" data-act="res-ticket" data-id="${s.id}">改为买票</button></div>`}
    </div>`;
  }).join('');
  const line = (s, extra) => `<div class="list-line"><span class="train" style="--lc:${lc(s.cc)}">${s.night ? ic('moon', 'ico-sm') : ''}${s.num}</span><span style="font-weight:500">${route(s)}</span><span class="faint small">${fmtMD(s.date)}</span><span style="margin-left:auto">${extra}</span></div>`;
  return `
  <div class="card res-head">
    <div class="ring"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--surface-3)" stroke-width="9"/><circle cx="40" cy="40" r="34" fill="none" stroke="var(--mint)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg>
      <div class="lbl"><div><b>${booked.length}/${need.length}</b><span>已订</span></div></div></div>
    <div class="stack" style="gap:4px;min-width:0"><div style="font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:-.01em">${need.length} 段需要订座</div><div class="small muted">预计订座费 <b style="color:var(--ink)">${eur(total)}</b>，不含在通票里。网站上订的座位不会出现在官方 App 里，记在这里方便查。</div></div>
  </div>
  ${todo.length ? `<h2 class="h-sec">待处理 <span class="cnt">${todo.length}</span></h2>${todoHtml}` : `<div class="note note-info"><span class="ib">${ic('check', 'ico-sm')}</span><span>需要订座的都订好了</span></div>`}
  ${booked.length ? `<h2 class="h-sec">已订 <span class="cnt">${booked.length}</span></h2><div class="card">${booked.map(({ s }) => line(s, `<span class="chip chip-ok">${ic('check', 'ico-sm')}${s.booking && s.booking.seat ? `<span class="mono">${esc(s.booking.seat)}</span>` : '已订'}</span>`)).join('')}</div>` : ''}
  ${ticket.length ? `<h2 class="h-sec">单独买票 <span class="cnt">车票一般已含座位</span></h2><div class="card">${ticket.map(({ s }) => line(s, `<span class="chip chip-ticket">买票</span>`)).join('')}</div>` : ''}
  ${none.length ? `<h2 class="h-sec">不需要订座 <span class="cnt">${none.length}</span></h2><div class="card">${none.map(({ s }) => line(s, `<span class="small faint">${s.res === 'optional' ? '可选' : '直接上车'}</span>`)).join('')}</div>` : ''}`;
}

/* ---------- 回本 ---------- */
function viewValue() {
  const t = state.trip;
  const a = analyze(t);
  const rec = a.rec;
  const cc = currentCost(t);
  const worst = a.tickets.min - rec.min.cost;
  const maxV = Math.max(a.tickets.max, ...a.plans.map(p => p.max.cost));
  const scale = Math.ceil(maxV / 200) * 200;
  const pct = v => (v / scale * 100).toFixed(2) + '%';
  const crow = (cls, name, sub, mid, min, max, act, sel) => `<div class="crow ${cls}" ${act ? `role="button" tabindex="0" data-act="use-pass" data-id="${act}" aria-label="改用${name}，预计 ${eur(mid)}"` : ''}>

      <span class="track"><span class="rng" style="left:${pct(min)};width:calc(${pct(max)} - ${pct(min)})"></span><span class="fill" style="width:${pct(mid)}"></span></span>
      <span class="val">${eur(mid)}</span>

  const rows = a.plans.map(p => crow(p === rec ? 'rec' : '', p.pass.name, `${p.pass.sub} · ${eur(p.pass.price)}`, p.mid.cost, p.min.cost, p.max.cost, p.pass.id === t.passId ? null : p.pass.id, p.pass.id === t.passId)).join('')
    + crow('tix', '全部买票', '不买通票', a.tickets.mid, a.tickets.min, a.tickets.max, null, false);
  const segRow = s => `<div class="bd-sub"><span>${s.num} ${stopName(t, s.after)} → ${nextStop(t, s.after).zh}</span><span>${eur(s.fee || s.p.mid)}</span></div>`;
  const chev = ic('down', 'ico-sm');
  return `
  ${passCard(t, rec.pass.id === t.passId ? '这是最省的通票 · 和全部单独买票比，按常见票价估算' : `换成 ${rec.pass.name} 还能再省 ${eur(cc.total - rec.mid.cost)}`)}
  <div class="note ${worst >= 0 ? 'note-info' : 'note-warn'}"><span class="ib">${ic('bulb', 'ico-sm')}</span><span>${worst >= 0
    ? `即使每段都买到最便宜的特价票，通票仍然省 ${eur(worst)}。`
    : `如果每段都能提前买到最便宜的特价票，单独买票反而便宜 <b>${eur(-worst)}</b>。特价票一般要提前一两个月抢，而且不能改签；行程不确定的话，通票更灵活。`}</span></div>
  <h2 class="h-sec">方案对比</h2>
  <div class="card">
    <div class="chart">${rows}</div>
    <div class="axis" style="margin-top:12px"><span></span><span class="ticks"><span>€0</span><span>${eur(scale / 2)}</span><span>${eur(scale)}</span></span><span></span></div>
    <div class="legend" style="margin-top:14px"><span><i style="background:var(--ink-3);width:18px;border-radius:999px"></i>按常见票价</span><span><i style="background:var(--surface-3);width:18px;height:6px;border-radius:999px"></i>最便宜到最贵</span><span>点方案可以切换</span></div>
  </div>
  <h2 class="h-sec">${cc.pass.name} 花费明细</h2>
  <div class="card" style="padding-block:6px 18px">
    <div class="bd-row"><span class="row">通票 ${badge('official')}</span><b>${eur(cc.pass.price)}</b></div>
    <details class="bd"><summary><span class="lb">${chev}订座费 · ${cc.feeSegs.length} 段</span><b>${eur(cc.fees)}</b></summary>${cc.feeSegs.map(segRow).join('')}</details>
    <details class="bd"><summary><span class="lb">${chev}单独买票 · ${cc.tixSegs.length} 段</span><b>${eur(cc.tix)}</b></summary>${cc.tixSegs.map(segRow).join('')}</details>
    <div class="bd-row total"><span style="font-weight:700">合计</span><b>${eur(cc.total)}</b></div>

function aiAsk(key, text) {
  if (state.ai.busy) return;
  state.ai.msgs.push({ role: 'me', text });
  state.ai.busy = true;
  render();
  state.ai.timer = setTimeout(() => { state.ai.busy = false; state.ai.msgs.push({ role: 'ai', html: aiAnswer(key) }); render(); }, 1100);
}
function aiAnswer(key) {
  const t = state.trip;
  if (key === 'crowded') {
    if (!t.stops.find(s => s.id === 's5')) return `<span>已经去掉佛罗伦萨了。还想再调整的话，告诉我想在哪多待几天。</span>`;
    const before = analyze(t), nt = makeTripB(t), after = analyze(nt);
    const d = after.rec.mid.cost - before.rec.mid.cost;
    state.ai.pending = nt;
    return `<span>第二周在意大利连着换了 4 个城市。建议去掉佛罗伦萨，从威尼斯直达罗马，威尼斯多住 1 晚、罗马多住 2 晚。少坐一段车，也少订一次座。</span>
      <div class="diff"><div class="diff-head">改动预览</div>
        <div class="diff-row del"><span class="op">−</span><span class="txt">佛罗伦萨（3晚）</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>威尼斯 2晚 → 3晚</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>罗马 7/25 到 3晚 → 7/23 到 5晚</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>威尼斯 → 罗马 改坐直达 FR 9425</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>火车 ${t.segs.length}段 → ${nt.segs.length}段</span></div>
        <div class="diff-cost"><span>预计总花费（规则引擎计算）</span><span><b>${eur(before.rec.mid.cost)} → ${eur(after.rec.mid.cost)}</b> <span class="save">${d < 0 ? `省 ${eur(-d)}` : `多 ${eur(d)}`}</span></span></div>
        <div class="diff-actions"><button class="btn btn-sm btn-primary" data-act="ai-apply">应用改动</button><button class="btn btn-sm" data-act="ai-reject">不要</button></div>
      </div>`;
  }
  if (key === 'strike') return `<span>我联网查了 2 个来源：目前还看不到 2027 年 7 月下旬意大利全国性铁路罢工的公告。意大利公共服务罢工需要至少提前 10 天公布，出发前一周再查一次比较稳。</span>
      <div class="sources"><span class="xs faint">来源</span><a href="https://scioperi.mit.gov.it/" target="_blank" rel="noopener">意大利交通部罢工日历 ${ic('ext', 'ico-sm')}</a><a href="https://www.trenitalia.com/en.html" target="_blank" rel="noopener">Trenitalia 官网公告 ${ic('ext', 'ico-sm')}</a></div>
      <span class="xs faint">原型示例回复，不代表真实查询结果</span>`;
  if (key === 'why') {
    const days = dayChoices(t).filter(d => d.choice === 'ticket');
    if (!days.length) return `<span>现在所有能用通票的日子都用了旅行日，没有建议单独买票的日子。柏林 → 慕尼黑那天是因为在居住国境内，只能买票。</span>`;
    const d = days[0], s = d.segs[0];
    const top = dayChoices(t).filter(x => x.choice === 'pass').sort((a, b) => b.value - a.value).slice(0, 2);
    return `<span><b>${fmtMD(d.date)} ${stopName(t, s.after)} → ${nextStop(t, s.after).zh}</b>：单独买票约 ${eur(s.p.mid)}，用通票还要付订座费 ${eur(s.fee)}，只省 ${eur(d.value)}。</span>
      <span>你的 ${passById(t.passId).name} 只有 ${passById(t.passId).days} 个旅行日，留给更值钱的日子更划算，比如 ${top.map(x => `${fmtMD(x.date)}（省 ${eur(x.value)}）`).join('、')}。</span>
      <span class="small muted">数字来自规则引擎，可以去<a href="#days">旅行日</a>页面自己拨开关试试。</span>`;
  }
  return `<span>原型里只演示下面三个常用问题。正式版会把你的问题和当前行程一起发给你选的 AI 服务商。</span>`;

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  const t = state.trip;
  switch (a) {
    case 'open-trip': go('route'); break;
    case 'toast': toast(b.dataset.msg); break;
    case 'src': e.stopPropagation(); e.preventDefault(); state.sheet = { type: 'src', src: b.dataset.src }; renderSheet(); break;
    case 'seg': state.sheet = { type: 'seg', id: b.dataset.id, mode: 'search' }; renderSheet(); break;
    case 'sheet-close': state.sheet = null; renderSheet(); break;
    case 'seg-mode': state.sheet.mode = b.dataset.v; renderSheet(); break;
    case 'pick': { const s = t.segs.find(x => x.id === state.sheet.id); Object.assign(s, { dep: b.dataset.dep, arr: b.dataset.arr, num: b.dataset.num }); render(); toast('已换成 ' + s.num); break; }
    case 'price-save': {
      const v = parseFloat($('price-in').value);
      if (!(v > 0)) { toast('请输入大于 0 的价格'); break; }
      const s = t.segs.find(x => x.id === b.dataset.id);
      s.p = { min: v, mid: v, max: v }; s.src = 'user';
      t.passId = null; t.overrides = {}; ensurePass(t);
      render(); toast('价格已更新，费用和推荐方案已重新计算'); break;
    }
    case 'ai-price': toast(!state.prefs.key ? '需要先在设置里填入 API key' : b.dataset.mode === 'est' ? '原型：AI 会估算价格区间' : '原型：AI 会联网查价格并附来源'); break;
    case 'day': {
      const d = b.dataset.date;
      const cur = dayChoices(t).find(x => x.date === d).choice;
      t.overrides[d] = cur === 'pass' ? 'ticket' : 'pass';
      state.flash = '#day-' + d; render(); break;
    }
    case 'days-reset': t.overrides = {}; render(); toast('已恢复推荐安排'); break;
    case 'use-pass': t.passId = b.dataset.id; t.overrides = {}; render(); toast('已改用 ' + passById(t.passId).name); break;
    case 'res-open': state.openRes = b.dataset.id || null; render(); if (state.openRes) { const i = $('rf-ref-' + state.openRes); if (i) i.focus(); } break;
    case 'res-save': {
      const s = t.segs.find(x => x.id === b.dataset.id);
      s.resStatus = 'booked';
      s.booking = { ref: $('rf-ref-' + s.id).value.trim(), seat: $('rf-seat-' + s.id).value.trim(), paid: parseFloat($('rf-paid-' + s.id).value) || s.fee };
      state.openRes = null; render(); toast('已标记为已订'); break;
    }
    case 'res-ticket': { const s = t.segs.find(x => x.id === b.dataset.id); t.overrides[s.date] = 'ticket'; render(); toast('这段改为单独买票，费用已重新计算'); break; }
    case 'ai-toggle': state.aiOpen = !state.aiOpen; render(); if (state.aiOpen && window.innerWidth >= 1024) { const i = $('aiInput'); if (i) i.focus(); } break;
    case 'ai-q': { const q = QUICK.find(x => x[0] === b.dataset.k); aiAsk(q[0], q[1]); break; }
    case 'ai-stop': clearTimeout(state.ai.timer); state.ai.busy = false; state.ai.msgs.push({ role: 'ai', html: '<span class="muted">已停止。</span>' }); render(); break;
    case 'ai-apply': {
      if (!state.ai.pending) break;
      state.prevTrip = clone(t);
      state.trip = state.ai.pending; ensurePass(state.trip); state.ai.pending = null;
      const last = state.ai.msgs[state.ai.msgs.length - 1];
      last.html = last.html.replace(/<div class="diff-actions">[\s\S]*?<\/div>/, `<div class="diff-actions"><span class="status-ok">${ic('check', 'ico-sm')}已应用</span></div>`);
      render(); toast('已应用 5 项改动', true); break;
    }
    case 'ai-reject': {
      state.ai.pending = null;
      const last = state.ai.msgs[state.ai.msgs.length - 1];
      last.html = last.html.replace(/<div class="diff-actions">[\s\S]*?<\/div>/, '<div class="diff-actions"><span class="small muted">没有应用</span></div>');
      render(); break;
    }
    case 'undo': if (state.prevTrip) { state.trip = state.prevTrip; state.prevTrip = null; render(); toast('已撤销'); } break;
    case 'wz': state.wizard[b.dataset.k] = b.dataset.v; render(); break;
    case 'wz-count': state.wizard.count = Math.min(9, Math.max(1, state.wizard.count + Number(b.dataset.d))); render(); break;
    case 'wz-step': { const d = $('wz-desc'); if (d) state.wizard.desc = d.value; state.wizard.step += Number(b.dataset.d); render(); break; }
    case 'wz-gen': toast('原型：AI 会根据描述生成路线，生成后你可以逐项修改'); break;
    case 'wz-create': state.wizard.step = 1; go('route'); toast('原型中使用示例行程'); break;
    case 'pf-show': savePrefInputs(); state.prefs.show = !state.prefs.show; render(); break;
    case 'pf-test': {
      savePrefInputs();
      if (!state.prefs.key) { state.prefs.test = 'nokey'; render(); break; }
      state.prefs.test = 'busy'; render();
      setTimeout(() => { state.prefs.test = 'ok'; render(); }, 800); break;
    }
    case 'pf-clear-key': state.prefs.key = ''; state.prefs.test = null; render(); toast('已清除 key'); break;
    case 'pf-encrypt': state.prefs.encrypt = b.checked; break;
    case 'theme': {
      state.prefs.theme = b.dataset.v;
      if (b.dataset.v === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', b.dataset.v);
      render(); break;
    }
    case 'pf-confirm': state.prefs.confirmClear = b.dataset.v === '1'; render(); break;
    case 'pf-clear-all': state.prefs.confirmClear = false; render(); toast('原型：不会真的清除数据'); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'prov') {
    savePrefInputs();
    state.prefs.provider = el.value;
    state.prefs.model = { deepseek: 'deepseek-chat', claude: 'claude-sonnet-5-5', custom: '' }[el.value];
    state.prefs.test = null; render();
  }
  if (el.dataset.act === 'wz-country') state.wizard.country = el.value;
});
document.addEventListener('input', e => { if (e.target.id === 'pf-key') state.prefs.key = e.target.value; });
document.addEventListener('submit', e => {
  if (e.target.dataset.act !== 'ai-form') return;
  e.preventDefault();
  const v = $('aiInput').value.trim();
  if (!v) return;
  const k = /赶|少去|减少|太累/.test(v) ? 'crowded' : /罢工|停运/.test(v) ? 'strike' : /为什么|买票/.test(v) ? 'why' : 'other';
  aiAsk(k, v);
});
$('sheetBackdrop').addEventListener('click', e => { if (e.target.id === 'sheetBackdrop') { state.sheet = null; renderSheet(); } });
document.addEventListener('keydown', e => {
  const rb = e.target.closest && e.target.closest('[role="button"][data-act]');
  if (rb && e.target === rb && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); rb.click(); return; }
  if (e.key !== 'Escape') return;
  if (state.sheet) { state.sheet = null; renderSheet(); }
  else if (state.aiOpen && window.innerWidth < 1024) { state.aiOpen = false; render(); }
});
function savePrefInputs() {
  const k = $('pf-key'), m = $('pf-model'), base = $('pf-base');
  if (k) state.prefs.key = k.value;
  if (m) state.prefs.model = m.value;
  if (base) state.prefs.base = base.value;
}

window.addEventListener('hashchange', () => { state.sheet = null; if (current() === 'value') state.animateValue = true; render(); window.scrollTo(0, 0); });
render();
})();
</script>

</body></html>
