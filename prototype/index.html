<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="../design/logo/favicon.ico"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Passhopper 原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@500&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* 布局：手机优先。玻璃顶栏 + 内容 + 悬浮胶囊标签栏；≥1024px 为左侧导航 + 内容 + 右侧 AI 面板。
   视觉：通票做成钱包里的交通卡，路线做成地铁线路图（每个国家一种线路色）。
   配色：薄荷汽水（薄荷绿 + 柠檬黄）；图标：Phosphor。 */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #EEF1F5; --surface-3: #E1E6ED; --line: #E3E7ED;
  --ink: #0F1524; --ink-2: #5A6478; --ink-3: #8C95A7; --on-ink: #FFFFFF;
  --blue: #2F6BFF; --blue-soft: #E4ECFF;
  --mint: #0C9F72; --mint-soft: #DCF5EB;
  --danger: #E23B3E; --danger-soft: #FDE5E5;
  --glass: rgba(255, 255, 255, .74); --glass-line: rgba(255, 255, 255, .9);
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 6px 22px rgba(16, 24, 40, .06);
  --shadow-lg: 0 18px 50px rgba(16, 24, 40, .16);
  --scrim: rgba(10, 14, 22, .45);
  --l-DE: #2F6BFF; --l-CH: #E23B3E; --l-IT: #0C9F72; --l-AT: #E8641C; --l-CZ: #7C5CFA; --on-line: #FFFFFF;
  /* 配色：薄荷汽水 */
  --primary: #00A37A; --primary-ink: #FFFFFF; --primary-soft: #D9F7EC;
  --sun: #FFD43B; --sun-ink: #2A2100; --sun-text: #8A6A00; --sun-soft: #FFF5CC;
  --pass-grad: linear-gradient(135deg, #C9F7E3 0%, #7FE6C0 48%, #2FD0A0 100%); --pass-ink: #042A20; --pass-chip: rgba(4, 42, 32, .1); --pass-shadow: 0 14px 34px rgba(0, 163, 122, .22);
  --hl-grad: linear-gradient(90deg, #00A37A, #14B8A6);
  --blob-a: rgba(0, 200, 150, .16); --blob-b: rgba(255, 212, 59, .14); --blob-c: rgba(20, 184, 166, .10);
  --f-body: "DM Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-display: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC", sans-serif;
  --f-mono: "DM Mono", ui-monospace, monospace;
  --r-md: 16px; --r-lg: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0E14; --surface: #151A23; --surface-2: #1C2230; --surface-3: #283041; --line: #252C3A;
    --ink: #F1F3F8; --ink-2: #A3ACBD; --ink-3: #6E7789; --on-ink: #0B0E14;
    --blue: #6B96FF; --blue-soft: #172341; --mint: #2DD4A0; --mint-soft: #0E2D24; --danger: #FF6B6B; --danger-soft: #3A1B1D;
    --glass: rgba(21, 26, 35, .74); --glass-line: rgba(255, 255, 255, .06);
    --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 6px 22px rgba(0, 0, 0, .35); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6);
    --l-DE: #5B8CFF; --l-CH: #FF6B6B; --l-IT: #2DD4A0; --l-AT: #FF9A55; --l-CZ: #A08BFF; --on-line: #0B0E14;
    --primary: #2FD9A6; --primary-ink: #04261C; --primary-soft: #0F2E25;
    --sun: #FFD84D; --sun-ink: #2A2100; --sun-text: #FFD84D; --sun-soft: #332B0A;
    --pass-grad: linear-gradient(135deg, #0E3B30 0%, #0F5A47 50%, #13866A 100%); --pass-ink: #E9FFF7; --pass-chip: rgba(255, 255, 255, .14); --pass-shadow: 0 14px 34px rgba(0, 0, 0, .4);
    --hl-grad: linear-gradient(90deg, #2FD9A6, #5EEAD4);
    --blob-a: rgba(47, 217, 166, .10); --blob-b: rgba(255, 216, 77, .06); --blob-c: rgba(94, 234, 212, .06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0E14; --surface: #151A23; --surface-2: #1C2230; --surface-3: #283041; --line: #252C3A;
  --ink: #F1F3F8; --ink-2: #A3ACBD; --ink-3: #6E7789; --on-ink: #0B0E14;
  --blue: #6B96FF; --blue-soft: #172341; --mint: #2DD4A0; --mint-soft: #0E2D24; --danger: #FF6B6B; --danger-soft: #3A1B1D;
  --glass: rgba(21, 26, 35, .74); --glass-line: rgba(255, 255, 255, .06);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 6px 22px rgba(0, 0, 0, .35); --shadow-lg: 0 18px 50px rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6);
  --l-DE: #5B8CFF; --l-CH: #FF6B6B; --l-IT: #2DD4A0; --l-AT: #FF9A55; --l-CZ: #A08BFF; --on-line: #0B0E14;
  --primary: #2FD9A6; --primary-ink: #04261C; --primary-soft: #0F2E25;
  --sun: #FFD84D; --sun-ink: #2A2100; --sun-text: #FFD84D; --sun-soft: #332B0A;
  --pass-grad: linear-gradient(135deg, #0E3B30 0%, #0F5A47 50%, #13866A 100%); --pass-ink: #E9FFF7; --pass-chip: rgba(255, 255, 255, .14); --pass-shadow: 0 14px 34px rgba(0, 0, 0, .4);
  --hl-grad: linear-gradient(90deg, #2FD9A6, #5EEAD4);
  --blob-a: rgba(47, 217, 166, .10); --blob-b: rgba(255, 216, 77, .06); --blob-c: rgba(94, 234, 212, .06);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(60px); }
.blobs i:nth-child(1) { width: 420px; height: 420px; background: var(--blob-a); top: -140px; right: -120px; }
.blobs i:nth-child(2) { width: 380px; height: 380px; background: var(--blob-b); top: 38%; left: -180px; }
.blobs i:nth-child(3) { width: 320px; height: 320px; background: var(--blob-c); bottom: -120px; right: 10%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); text-decoration: none; font-weight: 600; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2.5px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: 14px; }
.xs { font-size: 12px; }
.ico { width: 20px; height: 20px; flex: none; }
.ico-sm { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
.ico-lg { width: 24px; height: 24px; flex: none; }

/* ---------- 外框 ---------- */
.app { min-height: 100%; }
.sidenav { display: none; }
.main-col { min-width: 0; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 6px; min-height: 56px;
  padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border-bottom: 1px solid var(--line);
}
.topbar .title { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 800; font-size: 21px; letter-spacing: -.02em; color: var(--ink); }
.logo svg { width: 28px; height: 28px; flex: none; }
.logo small { font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--ink-2); letter-spacing: 0; }
.icon-btn { display: inline-grid; place-items: center; width: 42px; height: 42px; border: 0; background: transparent; border-radius: 999px; color: var(--ink); flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.ai-btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px 0 5px; border-radius: 999px; border: 0; background: var(--ink); color: var(--on-ink); font-weight: 700; font-size: 14px; white-space: nowrap; flex: none; }
.ai-btn .orb { width: 26px; height: 26px; border-radius: 50%; background: var(--primary); display: inline-grid; place-items: center; color: var(--primary-ink); }
.ai-btn[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); }
.ai-btn[aria-pressed="true"] .orb { background: var(--primary-ink); color: var(--primary); }

.view {
  max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px;
  padding-block: 14px 116px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tabbar {
  position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100% - 32px));
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 5px;
  background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(20px); backdrop-filter: saturate(1.6) blur(20px);
  border: 1px solid var(--glass-line); border-radius: 999px; box-shadow: var(--shadow-lg);
}
.tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; height: 50px; border-radius: 999px; font-size: 11px; font-weight: 500; color: var(--ink-2); text-decoration: none; transition: background .18s, color .18s; }
.tabbar a .ico { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { background: var(--primary); color: var(--primary-ink); font-weight: 700; }

@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 240px minmax(0, 1fr) auto; }
  .sidenav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 20px 12px; border-right: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
  .sidenav .logo { padding: 0 8px 14px; }
  .sidenav .tripname { padding: 18px 10px 6px; font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; }
  .sidenav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 500; }
  .sidenav a:hover { background: var(--surface-2); }
  .sidenav a[aria-current="page"] { background: var(--primary); color: var(--primary-ink); font-weight: 700; }
  .sidenav .spacer { flex: 1; }
  .tabbar { display: none; }
  .view { padding-block: 24px 56px; gap: 14px; }
  .topbar .back { display: none; }
}

/* ---------- 通用 ---------- */
.card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow); }
.h-sec { font-family: var(--f-display); font-size: 19px; font-weight: 800; letter-spacing: -.01em; margin-top: 6px; display: flex; align-items: center; gap: 8px; }
.h-sec .cnt { font-size: 13px; color: var(--ink-3); font-weight: 700; }
.h-sec .act { margin-left: auto; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--surface-2); font-weight: 700; font-size: 15px; color: var(--ink); text-decoration: none; transition: transform .12s, filter .12s; white-space: nowrap; }
.btn:hover { text-decoration: none; filter: brightness(.97); }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-ink { background: var(--ink); color: var(--on-ink); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { background: transparent; color: var(--primary); padding: 0 8px; }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 14px; }
.btn-block { width: 100%; }

.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; line-height: 1; padding: 4px 7px; border-radius: 999px; white-space: nowrap; border: 0; }
button.badge { cursor: pointer; }
.src-official { background: var(--mint-soft); color: var(--mint); }
.src-live { background: var(--blue-soft); color: var(--blue); }
.src-user { background: var(--surface-3); color: var(--ink); }
.src-ai_estimate { background: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1.2px var(--ink-3); }
.src-ai_search { background: transparent; color: var(--blue); box-shadow: inset 0 0 0 1.2px var(--blue); }
.src-stale { background: var(--sun-soft); color: var(--sun-text); }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.chip-must { background: var(--danger-soft); color: var(--danger); }
.chip-rec { background: var(--sun-soft); color: var(--sun-text); }
.chip-none { background: var(--surface-2); color: var(--ink-2); }
.chip-pass { background: var(--sun); color: var(--sun-ink); }
.chip-ticket { background: var(--surface-2); color: var(--ink); }
.chip-ok { background: var(--mint-soft); color: var(--mint); }
.chip-info { background: var(--blue-soft); color: var(--blue); }

.cc { display: inline-grid; place-items: center; min-width: 24px; height: 18px; padding: 0 5px; border-radius: 5px; font-size: 10px; font-weight: 800; color: var(--on-line); letter-spacing: .02em; font-family: var(--f-display); }

.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); font-size: 14px; background: var(--surface); box-shadow: var(--shadow); }
.note .ib { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.note .ib .ico { width: 17px; height: 17px; }
.note-info .ib { background: var(--blue-soft); color: var(--blue); }
.note-warn .ib { background: var(--sun-soft); color: var(--sun-text); }
.note-danger { box-shadow: inset 0 0 0 1.5px var(--danger), var(--shadow); }
.note-danger .ib { background: var(--danger-soft); color: var(--danger); }
.note > span:last-child { padding-top: 3px; }

.foot-note { font-size: 12px; color: var(--ink-3); text-align: center; padding-top: 8px; line-height: 1.7; }

/* ---------- 通票卡（大，回本页）与通票条（小，其他页） ---------- */
.passcard { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: 18px; color: var(--pass-ink); background: var(--pass-grad); box-shadow: var(--pass-shadow); isolation: isolate; }
.passcard::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(circle at 88% 12%, rgba(255,255,255,.35), transparent 42%), repeating-linear-gradient(115deg, rgba(255,255,255,.08) 0 2px, transparent 2px 14px); }
.passcard::after { content: ""; position: absolute; right: -60px; bottom: -80px; width: 210px; height: 210px; border-radius: 50%; border: 26px solid rgba(255,255,255,.14); z-index: -1; }
.pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.pc-kicker { font-size: 11px; font-weight: 800; letter-spacing: .14em; opacity: .8; }
.pc-name { font-family: var(--f-display); font-size: 22px; font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.pc-who { font-size: 12px; font-weight: 700; background: var(--pass-chip); padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.pc-big { font-family: var(--f-display); font-weight: 800; font-size: 50px; line-height: 1; letter-spacing: -.03em; margin-top: 14px; font-variant-numeric: tabular-nums; }
.pc-big small { font-size: 20px; font-weight: 700; letter-spacing: 0; margin-right: 4px; }
.pc-sub { font-size: 13px; opacity: .85; margin-top: 6px; }
.pc-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; margin-top: 16px; flex-wrap: wrap; }
.dots { display: flex; gap: 6px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--pass-ink); opacity: .22; }
.dots i.on { opacity: 1; }
.dots i.over { opacity: 1; background: var(--danger); }
.pc-valid { font-size: 12px; font-weight: 700; opacity: .9; }

.passbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-lg); color: var(--pass-ink); background: var(--pass-grad); box-shadow: var(--pass-shadow); text-decoration: none; position: relative; overflow: hidden; isolation: isolate; }
.passbar::before { content: ""; position: absolute; inset: 0; z-index: -1; background: repeating-linear-gradient(115deg, rgba(255,255,255,.08) 0 2px, transparent 2px 14px); }
.passbar:hover { text-decoration: none; }
.passbar .nm { font-family: var(--f-display); font-size: 18px; font-weight: 800; line-height: 1.2; }
.passbar .sv { font-family: var(--f-display); font-size: 26px; font-weight: 800; letter-spacing: -.02em; line-height: 1; display: inline-flex; align-items: center; gap: 2px; }
.passbar .sv small { font-size: 14px; font-weight: 700; margin-right: 2px; }
.passbar .meta2 { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; font-weight: 700; opacity: .9; }

/* ---------- 首页 ---------- */
.hello { display: flex; flex-direction: column; gap: 2px; padding: 4px 2px 0; }
.hello .k { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.hello h1 { font-family: var(--f-display); font-size: 32px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.hello h1 em { font-style: normal; background: var(--hl-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.trip-card { display: flex; flex-direction: column; gap: 12px; cursor: pointer; transition: transform .15s; }
.trip-card:hover { transform: translateY(-2px); }
.trip-card h3 { font-family: var(--f-display); font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
.mini-line { display: flex; align-items: center; }
.mini-line .st { width: 11px; height: 11px; border-radius: 50%; background: var(--surface); border: 3px solid var(--ink); flex: none; }
.mini-line .ln { height: 5px; flex: 1; }
.city-row { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 13px; color: var(--ink-2); }
.city-row span:not(:last-child)::after { content: "·"; margin-left: 6px; color: var(--ink-3); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 9px 12px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-size: 21px; font-weight: 800; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--ink-2); }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.ghost-card { border: 2px dashed var(--surface-3); background: transparent; box-shadow: none; }

/* ---------- 提醒折叠 ---------- */
details.alerts { background: var(--surface); border-radius: var(--r-md); box-shadow: var(--shadow); }
details.alerts > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 14px; }
details.alerts > summary::-webkit-details-marker { display: none; }
details.alerts > summary .ib { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--sun-soft); color: var(--sun-text); }
details.alerts > summary .txt { flex: 1; min-width: 0; }
details.alerts > summary .chev { color: var(--ink-3); transition: transform .2s; }
details.alerts[open] > summary .chev { transform: rotate(90deg); }
details.alerts .items { display: flex; flex-direction: column; gap: 10px; padding: 0 14px 14px 52px; font-size: 14px; color: var(--ink-2); }

/* ---------- 路线（紧凑） ---------- */
.timeline { display: flex; flex-direction: column; }
.stop { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 10px; }
.stop .rail { position: relative; }
.stop .rail::before { content: ""; position: absolute; left: 8px; top: 0; bottom: 0; width: 6px; border-radius: 3px; background: var(--lc, var(--surface-3)); }
.stop.first .rail::before { top: 13px; }
.stop.last .rail::before { top: 0; bottom: auto; height: 13px; background: var(--lc-prev, var(--surface-3)); }

  t.segs = t.segs.filter(s => s.id !== 'g6').map(s => s.id !== 'g5' ? s :
    Object.assign(s, { date: '2027-07-23', to: '罗马特米尼站', toL: 'Roma Termini', num: 'FR 9425', dep: '10:26', arr: '14:15', dur: '3小时49分', p: { min: 30, mid: 60, max: 85 }, src: 'ai_estimate', resStatus: 'todo', booking: null }));
  t.passId = null; t.overrides = {};
  return t;
}

/* ================= 规则引擎（原型简化版，对应开发文档 §3） ================= */
function dayMap(trip, k) {
  const m = new Map();
  for (const s of trip.segs) { if (!m.has(s.date)) m.set(s.date, { date: s.date, segs: [] }); m.get(s.date).segs.push(s); }
  for (const d of m.values()) {
    const cov = d.segs.filter(s => !s.home);
    d.coverable = cov.length > 0;
    d.value = cov.reduce((a, s) => a + s.p[k] - s.fee, 0);
    d.night = d.segs.some(s => s.night);
  }
  return [...m.values()].sort((a, b) => (a.date < b.date ? -1 : 1));
}
const ticketsTotal = (trip, k) => trip.segs.reduce((a, s) => a + s.p[k], 0);
function bestFor(pass, trip, k) {
  const days = dayMap(trip, k).filter(d => d.coverable && d.value > 0);
  const dates = trip.segs.map(s => s.date).sort();
  let best = { savings: 0, chosen: [] };
  for (let s = dates[0]; s <= dates[dates.length - 1]; s = addDays(s, 1)) {
    const end = addDays(s, pass.validity - 1);
    const inW = days.filter(d => d.date >= s && d.date <= end && !(d.date === end && d.night));
    const chosen = pass.kind === 'flexi' ? [...inW].sort((a, b) => b.value - a.value).slice(0, pass.days) : inW;
    const sv = chosen.reduce((a, d) => a + d.value, 0);
    if (sv > best.savings) best = { savings: sv, chosen: chosen.map(d => d.date).sort() };
  }
  return { ...best, cost: pass.price + ticketsTotal(trip, k) - best.savings };
}
function analyze(trip) {
  const plans = PASSES.map(p => ({ pass: p, mid: bestFor(p, trip, 'mid'), min: bestFor(p, trip, 'min'), max: bestFor(p, trip, 'max') })).sort((a, b) => a.mid.cost - b.mid.cost);
  const tickets = { min: ticketsTotal(trip, 'min'), mid: ticketsTotal(trip, 'mid'), max: ticketsTotal(trip, 'max') };
  return { plans, tickets, rec: plans[0] };
}
function ensurePass(trip) { if (!trip.passId) trip.passId = analyze(trip).rec.pass.id; }
function dayChoices(trip) {
  ensurePass(trip);
  const pass = passById(trip.passId);
  const opt = bestFor(pass, trip, 'mid');
  return dayMap(trip, 'mid').map(d => ({ ...d, choice: !d.coverable ? 'home' : (trip.overrides[d.date] || (opt.chosen.includes(d.date) ? 'pass' : 'ticket')) }));
}
function currentCost(trip) {
  const pass = passById(trip.passId);
  const days = dayChoices(trip);
  let fees = 0, tix = 0; const feeSegs = [], tixSegs = [];
  for (const d of days) for (const s of d.segs) {
    if (d.choice === 'pass' && !s.home) { fees += s.fee; if (s.fee) feeSegs.push(s); }
    else { tix += s.p.mid; tixSegs.push(s); }
  }
  const passDays = days.filter(d => d.choice === 'pass');
  const errors = [];
  if (pass.kind === 'flexi' && passDays.length > pass.days) errors.push(`选了 ${passDays.length} 个旅行日，${pass.name} 只有 ${pass.days} 天。`);
  if (passDays.length > 1) {
    const sp = span(passDays[0].date, passDays[passDays.length - 1].date) + 1;
    if (sp > pass.validity) errors.push(`第一个和最后一个旅行日跨了 ${sp} 天，超过了通票 ${pass.validity} 天的有效期。`);
  }
  return { pass, days, passDays, fees, tix, feeSegs, tixSegs, total: pass.price + fees + tix, errors };
}
function segChoice(trip, s) { const d = dayChoices(trip).find(x => x.date === s.date); return s.home ? 'home' : d.choice; }

  const choiceChip = c === 'pass' ? `<span class="chip chip-pass">旅行日</span>` : `<span class="chip chip-ticket">买票</span>`;
  const jr = s.journey === 'out' ? `<span class="chip chip-info">出境</span>` : s.journey === 'in' ? `<span class="chip chip-info">入境</span>` : '';
  return `<div class="ticket ${s.home ? 'problem' : ''}" role="button" tabindex="0" data-act="seg" data-id="${s.id}" style="--lc:${lc(s.cc)}" aria-label="${routeOf(t, s)}，${s.num}，${s.dep} 出发，查看详情">
    <div class="t-row"><span class="train">${s.night ? ic('moon', 'ico-sm', 'fill') : ''}${s.num}</span>
      <span class="times">${s.dep}<span class="arr">→</span>${s.arr}${s.night ? '<sup>+1</sup>' : ''}</span><span class="dur">${s.dur.replace('小时', 'h').replace('分', '')}</span></div>
    <div class="t-row"><span class="chips">${choiceChip}${resChip(s, c === 'pass')}${jr}</span>
      <span class="price"><b>${eurRange(s.p.min, s.p.max)}</b>${badge(s.src)}</span></div>
  </div>`;
}

/* ---------- 旅行日 ---------- */
function viewDays() {
  const t = state.trip;
  const cc = currentCost(t);
  const pass = cc.pass;
  const pd = cc.passDays;
  const winStart = pd.length ? pd[0].date : t.segs[0].date;
  const winEnd = addDays(winStart, pass.validity - 1);
  const over = pass.kind === 'flexi' && pd.length > pass.days;
  const rows = cc.days.map(d => {
    const segs = d.segs;
    const routeTxt = segs.map(s => `${s.night ? ic('moon', 'ico-sm', 'fill') : ''}${routeOf(t, s)}`).join('，');
    const p = segs.reduce((x, s) => x + s.p.mid, 0), fee = segs.reduce((x, s) => x + s.fee, 0);
    let why = '', err = false;
    if (d.choice === 'home') why = `居住国内不出境，只能买票 ${eur(p)}`;
    else if (d.choice === 'pass') {
      why = `省 ${eur(d.value)}（票价 ${eur(p)}${fee ? ` − 订座 ${eur(fee)}` : ''}）${segs.some(s => s.journey === 'out') ? ' · 出境' : segs.some(s => s.journey === 'in') ? ' · 入境' : ''}`;
      if (d.date > winEnd) { err = true; why = '不在通票有效期内'; }
      if (d.night && d.date === winEnd) { err = true; why = '有效期最后一天不能坐夜车'; }
    } else why = `买票 ${eur(p)}，用通票只省 ${eur(d.value)}`;
    if (over && d.choice === 'pass') err = true;
    const dd = D(d.date);
    const sw = d.choice === 'home'
      ? `<button class="switch locked" data-act="toast" data-msg="居住国内且当天不出境的行程不能用通票" aria-label="${fmtMD(d.date)} 只能买票"><span>${ic('lock', 'ico-sm', 'fill')}买票</span></button>`
      : `<button class="switch ${d.choice === 'pass' ? 'on' : ''}" role="switch" aria-checked="${d.choice === 'pass'}" data-act="day" data-date="${d.date}" aria-label="${fmtMD(d.date)} 用通票"><span>通票</span><span>买票</span></button>`;
    return `<div class="day is-${d.choice} ${err ? 'err' : ''}" id="day-${d.date}">
      <div class="datebox"><span class="d">${fmtMD(d.date)}</span><span class="w">周${WD[dd.getUTCDay()]}</span></div>
      <div class="day-route">${routeTxt}</div>${sw}
      <div class="day-why">${why}</div>
    </div>`;
  }).join('');
  const changed = Object.keys(t.overrides).length > 0;
  const recCost = bestFor(pass, t, 'mid').cost;
  return `
  ${passBar(t, `有效期 ${fmtMD(winStart)}–${fmtMD(winEnd)}`)}
  ${cc.errors.map(e => `<div class="note note-danger"><span class="ib">${ic('alert', 'ico', 'fill')}</span><span>${e}</span></div>`).join('')}
  <div class="legend"><span><i style="background:var(--sun)"></i>用旅行日</span><span><i style="background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink-3)"></i>单独买票</span><span>拨开关切换，花费实时重算</span></div>
  <div class="days">${rows}</div>
  <div class="total-bar" aria-live="polite">
    <div><div class="l">当前安排总花费</div><div class="v">${eur(cc.total)}</div></div>
    ${changed ? `<div style="text-align:right"><div class="l">推荐安排 ${eur(recCost)}</div><button class="btn btn-sm btn-ghost" data-act="days-reset">${ic('undo', 'ico-sm')}恢复推荐</button></div>` : `<span class="chip chip-ok">${ic('check', 'ico-sm')}已是最省</span>`}
  </div>`;
}

/* ---------- 订座 ---------- */
function viewRes() {
  const t = state.trip;
  const items = t.segs.map(s => ({ s, c: segChoice(t, s) }));
  const need = items.filter(x => (x.s.res === 'mandatory' || x.s.res === 'recommended') && x.c === 'pass');
  const todo = need.filter(x => x.s.resStatus !== 'booked').sort((a, b) => (b.s.quota ? 1 : 0) - (a.s.quota ? 1 : 0));
  const booked = need.filter(x => x.s.resStatus === 'booked');
  const other = items.filter(x => !need.includes(x));
  const total = need.reduce((a, x) => a + x.s.fee, 0);
  const pct = need.length ? booked.length / need.length : 1;
  const C = 2 * Math.PI * 34;
  const todoHtml = todo.map(({ s }) => {
    const open = state.openRes === s.id, lk = LINKS[s.cc];
    return `<div class="card res-item" id="res-${s.id}">
      <div class="top"><span class="train" style="--lc:${lc(s.cc)}">${s.night ? ic('moon', 'ico-sm', 'fill') : ''}${s.num}</span><span class="route">${routeOf(t, s)}</span><span class="date">${fmtMDW(s.date)}</span></div>
      <div class="row">${s.quota ? `<span class="hot">${ic('fire', 'ico-sm', 'fill')}抢手</span>` : ''}${resChip(s, true)}${s.res === 'recommended' ? `<span class="small muted">约 €10</span>` : ''}${badge('official')}<a class="small" style="margin-left:auto" href="${lk[1]}" target="_blank" rel="noopener">${lk[0]} ${ic('ext', 'ico-sm')}</a></div>
      ${s.quota ? `<div class="xs" style="color:var(--primary);font-weight:600">${s.quota}</div>` : ''}
      ${open ? `<div class="res-form">
          <label class="field">订座号<input class="mono" id="rf-ref-${s.id}" placeholder="例如 K7Q2XB"></label>
          <label class="field">车厢和座位<input id="rf-seat-${s.id}" placeholder="例如 8车 6A"></label>
          <label class="field">实际花费（€）<input type="number" inputmode="decimal" id="rf-paid-${s.id}" value="${s.fee || ''}"></label>
        </div>
        <div class="row"><button class="btn btn-primary btn-sm" data-act="res-save" data-id="${s.id}">保存</button><button class="btn btn-sm" data-act="res-open" data-id="">取消</button></div>`
      : `<div class="row"><button class="btn btn-sm btn-primary" data-act="res-open" data-id="${s.id}">${ic('check', 'ico-sm')}已订好</button><button class="btn btn-sm" data-act="res-ticket" data-id="${s.id}">改为买票</button></div>`}
    </div>`;
  }).join('');
  const line = (s, extra) => `<div class="list-line"><span class="train" style="--lc:${lc(s.cc)}">${s.night ? ic('moon', 'ico-sm', 'fill') : ''}${s.num}</span><span class="route">${routeOf(t, s)}</span><span class="end">${extra}</span></div>`;
  const otherTag = ({ s, c }) => c !== 'pass' ? `<span class="chip chip-ticket">买票含座</span>` : `<span class="small faint">${s.res === 'optional' ? '可选' : '直接上车'}</span>`;
  return `
  <div class="card res-head">
    <div class="ring"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="none" stroke="var(--surface-3)" stroke-width="10"/><circle cx="40" cy="40" r="34" fill="none" stroke="var(--primary)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct)}"/></svg>
      <div class="lbl"><b>${booked.length}/${need.length}</b></div></div>
    <div class="stack" style="gap:2px;min-width:0"><div style="font-family:var(--f-display);font-size:20px;font-weight:800;letter-spacing:-.01em">${need.length} 段要订座 · ${eur(total)}</div><div class="small muted">订座费不含在通票里，要另外付。</div></div>
  </div>
  ${todo.length ? `<h2 class="h-sec">待处理 <span class="cnt">${todo.length}</span></h2>${todoHtml}` : `<div class="note note-info"><span class="ib">${ic('check', 'ico')}</span><span>需要订座的都订好了</span></div>`}
  ${booked.length ? `<h2 class="h-sec">已订 <span class="cnt">${booked.length}</span></h2><div class="card">${booked.map(({ s }) => line(s, `<span class="chip chip-ok">${ic('check', 'ico-sm')}${s.booking && s.booking.seat ? `<span class="mono">${esc(s.booking.seat)}</span>` : '已订'}</span>`)).join('')}</div>` : ''}
  ${other.length ? `<h2 class="h-sec">其他 <span class="cnt">不用订座</span></h2><div class="card">${other.map(x => line(x.s, otherTag(x))).join('')}</div>` : ''}`;
}

/* ---------- 回本 ---------- */
function viewValue() {
  const t = state.trip;
  const a = analyze(t);
  const rec = a.rec;
  const cc = currentCost(t);
  const worst = a.tickets.min - rec.min.cost;
  const maxV = Math.max(a.tickets.max, ...a.plans.map(p => p.max.cost));
  const scale = Math.ceil(maxV / 200) * 200;
  const pct = v => (v / scale * 100).toFixed(2) + '%';
  const crow = (cls, name, sub, mid, min, max, act, sel) => `<div class="crow ${cls}" ${act ? `role="button" tabindex="0" data-act="use-pass" data-id="${act}" aria-label="改用${name}，预计 ${eur(mid)}"` : ''}>
      <span class="nm">${name}<small>${sub}</small>${sel ? '<span class="tagsel">使用中</span>' : ''}</span>
      <span class="track"><span class="rng" style="left:${pct(min)};width:calc(${pct(max)} - ${pct(min)})"></span><span class="fill" style="width:${pct(mid)}"></span></span>
      <span class="val">${eur(mid)}</span></div>`;
  const rows = a.plans.map(p => crow(p === rec ? 'rec' : '', p.pass.name, `${p.pass.sub} · ${eur(p.pass.price)}`, p.mid.cost, p.min.cost, p.max.cost, p.pass.id === t.passId ? null : p.pass.id, p.pass.id === t.passId)).join('')
    + crow('tix', '全部买票', '不买通票', a.tickets.mid, a.tickets.min, a.tickets.max, null, false);
  const segRow = s => `<div class="bd-sub"><span>${s.num} ${routeOf(t, s)}</span><span>${eur(s.fee || s.p.mid)}</span></div>`;
  return `
  ${passCard(t, rec.pass.id === t.passId ? '这是最省的通票 · 和全部单独买票比，按常见票价估算' : `换成 ${rec.pass.name} 还能再省 ${eur(cc.total - rec.mid.cost)}`)}
  <div class="note ${worst >= 0 ? 'note-info' : 'note-warn'}"><span class="ib">${ic('bulb', 'ico', 'duo')}</span><span>${worst >= 0
    ? `即使每段都买到最便宜的特价票，通票仍然省 ${eur(worst)}。`
    : `如果每段都提前抢到最便宜的特价票，单独买票反而便宜 <b>${eur(-worst)}</b>。不过特价票不能改签，行程不确定时通票更灵活。`}</span></div>
  <h2 class="h-sec">方案对比 <span class="cnt">点击切换</span></h2>
  <div class="card">
    <div class="chart">${rows}</div>
    <div class="axis" style="margin-top:10px"><span></span><span class="ticks"><span>€0</span><span>${eur(scale / 2)}</span><span>${eur(scale)}</span></span><span></span></div>
    <div class="legend" style="margin-top:10px"><span><i style="background:var(--ink-3);width:16px;border-radius:999px"></i>按常见票价</span><span><i style="background:var(--surface-3);width:16px;height:6px;border-radius:999px"></i>最便宜到最贵</span></div>
  </div>
  <h2 class="h-sec">${cc.pass.name} 明细</h2>
  <div class="card" style="padding-block:4px 16px">
    <div class="bd-row"><span class="row">通票 ${badge('official')}</span><b>${eur(cc.pass.price)}</b></div>
    <details class="bd"><summary><span class="lb">${ic('right', 'ico-sm')}订座费 · ${cc.feeSegs.length} 段</span><b>${eur(cc.fees)}</b></summary>${cc.feeSegs.map(segRow).join('')}</details>
    <details class="bd"><summary><span class="lb">${ic('right', 'ico-sm')}单独买票 · ${cc.tixSegs.length} 段</span><b>${eur(cc.tix)}</b></summary>${cc.tixSegs.map(segRow).join('')}</details>
    <div class="bd-row total"><span style="font-weight:700">合计</span><b>${eur(cc.total)}</b></div>
  </div>`;
}

/* ---------- 底部面板 ---------- */
function renderSheet() {
  const bd = $('sheetBackdrop');
  if (!state.sheet) { bd.hidden = true; return; }
  bd.hidden = false;
  const sh = $('sheet');
  if (state.sheet.type === 'src') {
    const s = state.sheet.src;
    sh.setAttribute('aria-label', '来源说明');
    sh.innerHTML = `<div class="grabber"></div><div class="spread"><h2>数据来源</h2><button class="icon-btn" data-act="sheet-close" aria-label="关闭">${ic('x')}</button></div>
      <div><span class="badge src-${s}" style="font-size:13px;padding:6px 10px">${SRC[s]}</span></div>
      <p style="margin:0">${SRC_DESC[s]}</p>
      <div class="row"><button class="btn btn-sm" data-act="toast" data-msg="原型：会打开预填好的 GitHub Issue">报告数据错误</button></div>`;
    return;
  }
  const t = state.trip;
  const s = t.segs.find(x => x.id === state.sheet.id);
  if (!s) { state.sheet = null; bd.hidden = true; return; }
  const mode = state.sheet.mode || 'search';
  const shift = (hm, h) => { let [H, M] = hm.split(':').map(Number); H = (H + h + 24) % 24; return `${String(H).padStart(2, '0')}:${String(M).padStart(2, '0')}`; };
  const [tp, no] = s.num.split(' ');
  const cands = s.night ? [[s.dep, s.arr, s.num]] : [[shift(s.dep, -2), shift(s.arr, -2), `${tp} ${parseInt(no) - 2}`], [s.dep, s.arr, s.num], [shift(s.dep, 2), shift(s.arr, 2), `${tp} ${parseInt(no) + 2}`]];
  const lk = LINKS[s.cc];
  sh.setAttribute('aria-label', '火车段详情');
  sh.innerHTML = `<div class="grabber"></div>
    <div class="spread"><div><h2>${routeOf(t, s)}</h2><div class="small muted">${fmtLong(s.date)} · ${s.from} → ${s.to}</div></div><button class="icon-btn" data-act="sheet-close" aria-label="关闭">${ic('x')}</button></div>
    ${s.home ? `<div class="note note-info"><span class="ib">${ic('info', 'ico', 'duo')}</span><span>这段在居住国${t.traveller.country}境内，当天不出境，不能用通票。DB 提前买特价票通常更便宜。</span></div>` : ''}
    <div class="tabs2" role="group"><button data-act="seg-mode" data-v="search" aria-pressed="${mode === 'search'}">查时刻表</button><button data-act="seg-mode" data-v="manual" aria-pressed="${mode === 'manual'}">手动填写</button></div>
    ${mode === 'search' ? `
      <div class="spread small"><span class="muted">候选车次</span><span class="row" style="gap:6px">来自 <a href="https://transitous.org/sources/" target="_blank" rel="noopener">Transitous</a>${badge('live')}</span></div>
      <div class="stack">${cands.map(([d, a, n]) => `<button class="cand" data-act="pick" data-dep="${d}" data-arr="${a}" data-num="${n}" aria-pressed="${d === s.dep}">
          <span class="times">${d}<span class="arr">→</span>${a}${s.night ? '<sup>+1</sup>' : ''}</span><span class="small muted">${s.dur}</span>
          <span class="small" style="font-weight:500">${n} · 直达</span><span>${resChip(s, false)}</span></button>`).join('')}</div>`
    : `<div class="res-form"><label class="field">车次<input value="${esc(s.num)}"></label><label class="field">出发<input type="time" value="${s.dep}"></label><label class="field">到达<input type="time" value="${s.arr}"></label></div>
       <p class="small muted" style="margin:0">原型中手动填写的内容不会保存。</p>`}
    <div class="stack" style="gap:8px"><span class="lbl">去官网核实</span><div class="row"><a class="pill" href="${lk[1]}" target="_blank" rel="noopener">${lk[0]} ${ic('ext', 'ico-sm')}</a><a class="pill" href="https://int.bahn.de/en" target="_blank" rel="noopener">DB 查询 ${ic('ext', 'ico-sm')}</a><a class="pill" href="https://www.seat61.com/" target="_blank" rel="noopener">Seat61 ${ic('ext', 'ico-sm')}</a></div></div>
    <div class="stack"><span class="lbl">单独买票价格 · 现在 ${eurRange(s.p.min, s.p.max)} ${badge(s.src)}</span>
      <div class="price-input"><span class="in"><span>€</span><input type="number" inputmode="decimal" id="price-in" placeholder="${Math.round(s.p.mid)}" aria-label="我查到的价格（欧元）"></span><button class="btn btn-ink" data-act="price-save" data-id="${s.id}">用这个价格</button></div>
      <div class="row"><button class="btn btn-sm" data-act="ai-price" data-mode="est">${ic('spark', 'ico-sm', 'fill')}AI 估算</button><button class="btn btn-sm" data-act="ai-price" data-mode="search">${ic('globe', 'ico-sm')}AI 联网查</button></div></div>`;
}

/* ---------- AI 助手 ---------- */
const QUICK = [['crowded', '第二周太赶了，少去一个城市'], ['strike', '7月底意大利有铁路罢工吗？'], ['why', '为什么有一天建议单独买票？']];
function renderAI() {
  const el = $('aiPanel');
  el.hidden = !(state.aiOpen && inTripRoute(current()));
  if (el.hidden) return;
  const provName = { deepseek: 'DeepSeek', claude: 'Claude', custom: '自定义' }[state.prefs.provider];
  const msgs = state.ai.msgs.map(m => m.role === 'me' ? `<div class="msg me">${esc(m.text)}</div>` : `<div class="msg ai">${m.html}</div>`).join('');
  const caps = [['spark', 'var(--primary-soft)', 'var(--primary)', '一句话改行程，先看改动再决定'], ['globe', 'var(--blue-soft)', 'var(--blue)', '联网查罢工、停运、订座规则'], ['bulb', 'var(--sun-soft)', 'var(--sun-text)', '解释旅行日和费用怎么算']];
  el.innerHTML = `
    <div class="ai-head"><span class="orb-lg">${ic('spark', 'ico', 'fill')}</span><span class="t"><b>AI 助手</b><span>${provName} · 原型为预设回复</span></span><button class="icon-btn" data-act="ai-toggle" aria-label="关闭 AI 助手">${ic('x')}</button></div>
    <div class="ai-msgs" id="aiMsgs" aria-live="polite">
      ${!state.ai.msgs.length ? `<div class="ai-empty"><h3>想怎么改你的行程？</h3>${caps.map(([i, bg, fg, txt]) => `<div class="cap"><span class="ib" style="background:${bg};color:${fg}">${ic(i, 'ico', 'duo')}</span><span>${txt}</span></div>`).join('')}<span class="xs faint">回复是预设的，但改动预览里的费用由规则引擎实时计算。</span></div>` : msgs}
      ${state.ai.busy ? `<div class="typing"><i></i><i></i><i></i><span>思考中</span><button class="btn btn-sm" data-act="ai-stop" style="min-height:30px;padding:0 10px">${ic('stop', 'ico-sm', 'fill')}停止</button></div>` : ''}
    </div>
    <div class="ai-quick">${QUICK.map(([k, q]) => `<button data-act="ai-q" data-k="${k}">${q}</button>`).join('')}</div>
    <form class="ai-input" data-act="ai-form"><input id="aiInput" placeholder="说说你想怎么改…" aria-label="输入问题或要求" autocomplete="off"><button type="submit" aria-label="发送">${ic('send', 'ico-sm', 'fill')}</button></form>`;
  const box = $('aiMsgs'); box.scrollTop = box.scrollHeight;
}
function aiAsk(key, text) {
  if (state.ai.busy) return;
  state.ai.msgs.push({ role: 'me', text });
  state.ai.busy = true;
  render();
  state.ai.timer = setTimeout(() => { state.ai.busy = false; state.ai.msgs.push({ role: 'ai', html: aiAnswer(key) }); render(); }, 1100);
}
function aiAnswer(key) {
  const t = state.trip;
  if (key === 'crowded') {
    if (!t.stops.find(s => s.id === 's5')) return `<span>已经去掉佛罗伦萨了。还想再调整的话，告诉我想在哪多待几天。</span>`;
    const before = analyze(t), nt = makeTripB(t), after = analyze(nt);
    const d = after.rec.mid.cost - before.rec.mid.cost;
    state.ai.pending = nt;
    return `<span>第二周在意大利连着换了 4 个城市。建议去掉佛罗伦萨，从威尼斯直达罗马，威尼斯多住 1 晚、罗马多住 2 晚。</span>
      <div class="diff"><div class="diff-head">改动预览</div>
        <div class="diff-row del"><span class="op">−</span><span class="txt">佛罗伦萨（3晚）</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>威尼斯 2晚 → 3晚</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>罗马 7/25 到 3晚 → 7/23 到 5晚</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>威尼斯 → 罗马 改坐直达 FR 9425</span></div>
        <div class="diff-row mod"><span class="op">~</span><span>火车 ${t.segs.length}段 → ${nt.segs.length}段</span></div>
        <div class="diff-cost"><span>预计总花费（规则引擎计算）</span><span><b>${eur(before.rec.mid.cost)} → ${eur(after.rec.mid.cost)}</b> <span class="save">${d < 0 ? `省 ${eur(-d)}` : `多 ${eur(d)}`}</span></span></div>
        <div class="diff-actions"><button class="btn btn-sm btn-primary" data-act="ai-apply">应用改动</button><button class="btn btn-sm" data-act="ai-reject">不要</button></div>
      </div>`;
  }
  if (key === 'strike') return `<span>我联网查了 2 个来源：目前还看不到 2027 年 7 月下旬意大利全国性铁路罢工的公告。意大利公共服务罢工需要至少提前 10 天公布，出发前一周再查一次比较稳。</span>
      <div class="sources"><span class="xs faint">来源</span><a href="https://scioperi.mit.gov.it/" target="_blank" rel="noopener">意大利交通部罢工日历 ${ic('ext', 'ico-sm')}</a><a href="https://www.trenitalia.com/en.html" target="_blank" rel="noopener">Trenitalia 官网公告 ${ic('ext', 'ico-sm')}</a></div>
      <span class="xs faint">原型示例回复，不代表真实查询结果</span>`;
  if (key === 'why') {
    const days = dayChoices(t).filter(d => d.choice === 'ticket');
    if (!days.length) return `<span>现在所有能用通票的日子都用了旅行日，没有建议单独买票的日子。柏林 → 慕尼黑那天是因为在居住国境内，只能买票。</span>`;
    const d = days[0], s = d.segs[0];
    const top = dayChoices(t).filter(x => x.choice === 'pass').sort((a, b) => b.value - a.value).slice(0, 2);
    return `<span><b>${fmtMD(d.date)} ${routeOf(t, s)}</b>：单独买票约 ${eur(s.p.mid)}，用通票还要付订座费 ${eur(s.fee)}，只省 ${eur(d.value)}。</span>
      <span>你的 ${passById(t.passId).name} 只有 ${passById(t.passId).days} 个旅行日，留给更值钱的日子更划算，比如 ${top.map(x => `${fmtMD(x.date)}（省 ${eur(x.value)}）`).join('、')}。</span>
      <span class="small muted">数字来自规则引擎，可以去<a href="#days">旅行日</a>页面自己拨开关试试。</span>`;
  }
  return `<span>原型里只演示下面三个常用问题。正式版会把你的问题和当前行程一起发给你选的 AI 服务商。</span>`;
}

/* ---------- 提示条 ---------- */
let toastTimer = null;
function toast(msg, undo) {
  const el = $('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button data-act="undo">${ic('undo', 'ico-sm')}撤销</button>` : ''}`;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, undo ? 10000 : 3000);
}

/* ================= 事件 ================= */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act;
  const t = state.trip;
  switch (a) {
    case 'open-trip': go('route'); break;
    case 'toast': toast(b.dataset.msg); break;
    case 'edit-route': state.editRoute = !state.editRoute; render(); break;
    case 'src': e.stopPropagation(); e.preventDefault(); state.sheet = { type: 'src', src: b.dataset.src }; renderSheet(); break;
    case 'seg': state.sheet = { type: 'seg', id: b.dataset.id, mode: 'search' }; renderSheet(); break;
    case 'sheet-close': state.sheet = null; renderSheet(); break;
    case 'seg-mode': state.sheet.mode = b.dataset.v; renderSheet(); break;
    case 'pick': { const s = t.segs.find(x => x.id === state.sheet.id); Object.assign(s, { dep: b.dataset.dep, arr: b.dataset.arr, num: b.dataset.num }); render(); toast('已换成 ' + s.num); break; }
    case 'price-save': {
      const v = parseFloat($('price-in').value);
      if (!(v > 0)) { toast('请输入大于 0 的价格'); break; }
      const s = t.segs.find(x => x.id === b.dataset.id);
      s.p = { min: v, mid: v, max: v }; s.src = 'user';
      t.passId = null; t.overrides = {}; ensurePass(t);
      render(); toast('价格已更新，费用和推荐方案已重新计算'); break;
    }
    case 'ai-price': toast(!state.prefs.key ? '需要先在设置里填入 API key' : b.dataset.mode === 'est' ? '原型：AI 会估算价格区间' : '原型：AI 会联网查价格并附来源'); break;
    case 'day': {
      const d = b.dataset.date;
      const cur = dayChoices(t).find(x => x.date === d).choice;
      t.overrides[d] = cur === 'pass' ? 'ticket' : 'pass';
      state.flash = '#day-' + d; render(); break;
    }
    case 'days-reset': t.overrides = {}; render(); toast('已恢复推荐安排'); break;
    case 'use-pass': t.passId = b.dataset.id; t.overrides = {}; render(); toast('已改用 ' + passById(t.passId).name); break;
    case 'res-open': state.openRes = b.dataset.id || null; render(); if (state.openRes) { const i = $('rf-ref-' + state.openRes); if (i) i.focus(); } break;
    case 'res-save': {
      const s = t.segs.find(x => x.id === b.dataset.id);
      s.resStatus = 'booked';
      s.booking = { ref: $('rf-ref-' + s.id).value.trim(), seat: $('rf-seat-' + s.id).value.trim(), paid: parseFloat($('rf-paid-' + s.id).value) || s.fee };
      state.openRes = null; render(); toast('已标记为已订'); break;
    }
    case 'res-ticket': { const s = t.segs.find(x => x.id === b.dataset.id); t.overrides[s.date] = 'ticket'; render(); toast('这段改为单独买票，费用已重新计算'); break; }
    case 'ai-toggle': state.aiOpen = !state.aiOpen; render(); if (state.aiOpen && window.innerWidth >= 1024) { const i = $('aiInput'); if (i) i.focus(); } break;
    case 'ai-q': { const q = QUICK.find(x => x[0] === b.dataset.k); aiAsk(q[0], q[1]); break; }
    case 'ai-stop': clearTimeout(state.ai.timer); state.ai.busy = false; state.ai.msgs.push({ role: 'ai', html: '<span class="muted">已停止。</span>' }); render(); break;
    case 'ai-apply': {
      if (!state.ai.pending) break;
      state.prevTrip = clone(t);
      state.trip = state.ai.pending; ensurePass(state.trip); state.ai.pending = null;
      const last = state.ai.msgs[state.ai.msgs.length - 1];
      last.html = last.html.replace(/<div class="diff-actions">[\s\S]*?<\/div>/, `<div class="diff-actions"><span class="status-ok">${ic('check', 'ico-sm')}已应用</span></div>`);
      render(); toast('已应用 5 项改动', true); break;
    }
    case 'ai-reject': {
      state.ai.pending = null;
      const last = state.ai.msgs[state.ai.msgs.length - 1];
      last.html = last.html.replace(/<div class="diff-actions">[\s\S]*?<\/div>/, '<div class="diff-actions"><span class="small muted">没有应用</span></div>');
      render(); break;
    }
    case 'undo': if (state.prevTrip) { state.trip = state.prevTrip; state.prevTrip = null; render(); toast('已撤销'); } break;
    case 'wz': state.wizard[b.dataset.k] = b.dataset.v; render(); break;
    case 'wz-count': state.wizard.count = Math.min(9, Math.max(1, state.wizard.count + Number(b.dataset.d))); render(); break;
    case 'wz-step': { const d = $('wz-desc'); if (d) state.wizard.desc = d.value; state.wizard.step += Number(b.dataset.d); render(); break; }
    case 'wz-gen': toast('原型：AI 会根据描述生成路线，生成后你可以逐项修改'); break;
    case 'wz-create': state.wizard.step = 1; go('route'); toast('原型中使用示例行程'); break;
    case 'pf-show': savePrefInputs(); state.prefs.show = !state.prefs.show; render(); break;
    case 'pf-test': {
      savePrefInputs();
      if (!state.prefs.key) { state.prefs.test = 'nokey'; render(); break; }
      state.prefs.test = 'busy'; render();
      setTimeout(() => { state.prefs.test = 'ok'; render(); }, 800); break;
    }
    case 'pf-clear-key': state.prefs.key = ''; state.prefs.test = null; render(); toast('已清除 key'); break;
    case 'pf-encrypt': state.prefs.encrypt = b.checked; break;
    case 'theme': {
      state.prefs.theme = b.dataset.v;
      if (b.dataset.v === 'system') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', b.dataset.v);
      render(); break;
    }
    case 'pf-confirm': state.prefs.confirmClear = b.dataset.v === '1'; render(); break;
    case 'pf-clear-all': state.prefs.confirmClear = false; render(); toast('原型：不会真的清除数据'); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'prov') {
    savePrefInputs();
    state.prefs.provider = el.value;
    state.prefs.model = { deepseek: 'deepseek-chat', claude: 'claude-sonnet-5-5', custom: '' }[el.value];
    state.prefs.test = null; render();
  }
  if (el.dataset.act === 'wz-country') state.wizard.country = el.value;
});
document.addEventListener('input', e => { if (e.target.id === 'pf-key') state.prefs.key = e.target.value; });
document.addEventListener('submit', e => {
  if (e.target.dataset.act !== 'ai-form') return;
  e.preventDefault();
  const v = $('aiInput').value.trim();
  if (!v) return;
  const k = /赶|少去|减少|太累/.test(v) ? 'crowded' : /罢工|停运/.test(v) ? 'strike' : /为什么|买票/.test(v) ? 'why' : 'other';
  aiAsk(k, v);
});
$('sheetBackdrop').addEventListener('click', e => { if (e.target.id === 'sheetBackdrop') { state.sheet = null; renderSheet(); } });
document.addEventListener('keydown', e => {
  const rb = e.target.closest && e.target.closest('[role="button"][data-act]');
  if (rb && e.target === rb && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); rb.click(); return; }
  if (e.key !== 'Escape') return;
  if (state.sheet) { state.sheet = null; renderSheet(); }
  else if (state.aiOpen && window.innerWidth < 1024) { state.aiOpen = false; render(); }
});
function savePrefInputs() {
  const k = $('pf-key'), m = $('pf-model'), base = $('pf-base');
  if (k) state.prefs.key = k.value;
  if (m) state.prefs.model = m.value;
  if (base) state.prefs.base = base.value;
}

window.addEventListener('hashchange', () => { state.sheet = null; if (current() === 'value') state.animateValue = true; render(); window.scrollTo(0, 0); });
render();
})();
</script>
