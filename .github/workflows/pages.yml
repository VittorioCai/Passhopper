name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Single-page app: unknown paths should load the app instead of GitHub's 404 page.
      - run: cp app/dist/index.html app/dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A deploy that timed out can stay "in progress" on GitHub's side and block every later deploy.
      - name: Cancel stuck Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            [ "$sha" = "${{ github.sha }}" ] && continue
            if gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1; then
              echo "Cancelled deployment $sha"
            fi
          done
      - id: deployment
        uses: actions/deploy-pages@v5
